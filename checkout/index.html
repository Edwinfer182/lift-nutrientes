<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar pedido | SUPGO</title><style>body{font-family:Poppins,Arial,sans-serif;margin:0;background:#fff;color:#111}.loading{max-width:640px;margin:12vh auto;text-align:center;padding:24px}.loading a{color:inherit}</style></head><body><main class="loading" id="checkoutLoading"><h1>Finalizar pedido</h1><p>Cargando el formulario seguro…</p></main>
<script>
(async function(){
 const loading=document.getElementById('checkoutLoading');
 try{
  const response=await fetch('/?supgo_checkout_page=1',{cache:'no-store'});
  if(!response.ok)throw Error('No fue posible abrir el checkout.');
  let html=await response.text();
  if(!html.includes('checkoutModal'))throw Error('No se encontró el checkout original.');
  // Conservar el carrito antes de cargar de nuevo la aplicación principal.
  const cartSnapshot=localStorage.getItem('liftCartV2');
  const metaSnapshot=localStorage.getItem('liftCartMetaV1');
  const bootstrap=`<style id="supgo-standalone-checkout-style">
    body.supgo-standalone-checkout{background:#fff!important}
    body.supgo-standalone-checkout #checkoutModal{visibility:visible!important;opacity:1!important;display:block!important;position:relative!important;inset:auto!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;width:100%!important;height:auto!important;min-height:100dvh!important;max-height:none!important;overflow:visible!important;transform:none!important;background:#fff!important;padding:0!important;margin:0!important;z-index:1!important}
    body.supgo-standalone-checkout #checkoutModal .modal-content,body.supgo-standalone-checkout #checkoutModal .checkout-content{position:relative!important;transform:none!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;width:100%!important;max-width:800px!important;max-height:none!important;height:auto!important;overflow:visible!important;margin:0 auto!important;box-shadow:none!important;border:0!important;border-radius:0!important}
    body.supgo-standalone-checkout #checkoutModal .modal-backdrop{display:none!important}
  </style>
  <script>(function(){
    // Sincronizar el carrito que llega desde las fichas SEO.
    const savedCart=${JSON.stringify(cartSnapshot)};
    const savedMeta=${JSON.stringify(metaSnapshot)};
    function countCart(){
      try{
        const cart=JSON.parse(localStorage.getItem('liftCartV2')||'{}');
        return Object.values(cart).reduce((sum,v)=>sum+Math.max(0,Number(typeof v==='object'?(v.quantity??v.qty):v)||0),0);
      }catch(_){return 0}
    }
    if(!countCart()&&savedCart){
      try{
        const parsed=JSON.parse(savedCart);
        if(parsed&&Object.values(parsed).some(v=>Number(typeof v==='object'?(v.quantity??v.qty):v)>0)){
          localStorage.setItem('liftCartV2',savedCart);
          if(savedMeta&&!localStorage.getItem('liftCartMetaV1'))localStorage.setItem('liftCartMetaV1',savedMeta);
        }
      }catch(_){}
    }
    // Navegar al seguimiento únicamente si Supabase confirma la creación.
    let creatingOrder=false;
    let redirecting=false;
    document.addEventListener('click',function(ev){
      const button=ev.target.closest('button,input[type="submit"]');
      if(button&&/generar pedido/i.test((button.textContent||button.value||'').trim()))creatingOrder=true;
    },true);
    function finishOrder(id){
      if(redirecting)return;
      redirecting=true;creatingOrder=false;
      const parsed=Number(id);
      const dest='/mis-pedidos/'+(Number.isSafeInteger(parsed)&&parsed>0?'?pedido='+encodeURIComponent(parsed):'');
      window.location.replace(dest);
    }
    function orderId(data){
      if(Array.isArray(data))return orderId(data[0]);
      if(!data||typeof data!=='object')return null;
      const candidate=data.id_pedido??data.pedido_id??data.order_id??data.id??data.pedido?.id??data.data?.id;
      return Number(candidate)>0?candidate:null;
    }
    const originalFetch=window.fetch.bind(window);
    window.fetch=async function(input,init){
      const result=await originalFetch(input,init);
      try{
        const url=String(typeof input==='string'?input:input?.url||'');
        const method=String(init?.method||(typeof input==='object'&&input?.method)||'GET').toUpperCase();
        const isOrderCreation=/\\/rest\\/v1\\/(?:lift_pedidos|rpc\\/[^/?]*(?:pedido|orden|checkout|order)[^/?]*)(?:[?\\/]|$)/i.test(url);
        if(creatingOrder&&!redirecting&&result.ok&&method==='POST'&&isOrderCreation){
          let id=null;
          try{const body=await result.clone().text();if(body)id=orderId(JSON.parse(body));}catch(parseError){console.warn('Respuesta de pedido sin JSON:',parseError)}
          setTimeout(()=>finishOrder(id),800);
        }
      }catch(err){console.warn('Redirección posterior al pedido:',err)}
      return result;
    };
    // Ocultar secuencias de escape literales que quedaron impresas debajo del checkout.
    function removeLiteralEscapes(){
      const modal=document.getElementById('checkoutModal');
      const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      const toRemove=[];let node;
      while((node=walker.nextNode())){
        if(modal?.contains(node))continue;
        const value=node.nodeValue||'';
        const cleaned=value.replaceAll(String.fromCharCode(92),'').replace(/[nrt]/g,'').trim();
        if(value.includes(String.fromCharCode(92))&&cleaned==='')toRemove.push(node);
      }
      toRemove.forEach(node=>node.remove());
    }
    let tries=0;
    const timer=setInterval(function(){
      const modal=document.getElementById('checkoutModal');
      if(modal && typeof window.openCheckout==='function' && document.readyState==='complete'){
        clearInterval(timer);
        try{
          // La aplicación y el catálogo deben terminar su carga antes de leer el carrito.
          window.dispatchEvent(new Event('storage'));
          window.dispatchEvent(new Event('supgo-cart-change'));
          window.openCheckout();
          // Si el carrito tiene artículos, el checkout no puede enviarse con total cero.
          const checkout=document.getElementById('checkoutModal');
          const warning=document.createElement('p');
          warning.id='supgoCheckoutCartWarning';
          warning.style.cssText='display:none;color:#a02323;font:500 13px Poppins,Arial,sans-serif;padding:10px 14px;margin:8px 0;background:#fff1f1;border-radius:7px';
          warning.textContent='Estamos sincronizando tus productos. Vuelve al carrito si no aparecen.';
          (checkout.querySelector('.modal-content, .checkout-content')||checkout).append(warning);
          function verifyCheckoutCart(){
            const totalText=(checkout.innerText||'');
            const nonzero=/subtotal[^\\n]*\\$\\s*(?!0(?:\\D|$))[\\d.,]+/i.test(totalText);
            const hasSaved=countCart()>0;
            const orderButton=[...checkout.querySelectorAll('button')].find(b=>/generar pedido/i.test(b.textContent||''));
            if(hasSaved&&!nonzero){
              warning.style.display='block';
              if(orderButton){orderButton.disabled=true;orderButton.title='Primero deben cargarse los productos del carrito';}
            }else{
              warning.style.display='none';
              if(orderButton&&orderButton.title==='Primero deben cargarse los productos del carrito'){orderButton.disabled=false;orderButton.removeAttribute('title');}
            }
          }
          setTimeout(verifyCheckoutCart,1200);
          setTimeout(verifyCheckoutCart,3500);
          setTimeout(verifyCheckoutCart,6500);
          document.body.classList.add('supgo-standalone-checkout');
          if(!document.getElementById('supgoCheckoutHomeBack')){
            const back=document.createElement('a');
            back.id='supgoCheckoutHomeBack';
            back.href='/home/';
            back.textContent='← Volver al inicio';
            back.setAttribute('aria-label','Volver a la página de inicio');
            back.style.cssText='display:inline-flex;align-items:center;gap:7px;padding:12px 16px;margin:6px 12px 0;color:#111;font:500 13px Poppins,Arial,sans-serif;text-decoration:none;min-height:44px;border-radius:6px;background:#f5f5f5';
            const content=modal.querySelector('.modal-content, .checkout-content')||modal;
            content.prepend(back);
          }
          removeLiteralEscapes();
          let node=modal;
          while(node && node!==document.body){for(const child of node.parentElement.children){if(child!==node && child.tagName!=='SCRIPT' && child.tagName!=='STYLE')child.style.setProperty('display','none','important')}node=node.parentElement}
          document.title='Finalizar pedido | SUPGO';
        }catch(error){console.error('Checkout SUPGO:',error)}
      }else if(++tries>=120){clearInterval(timer);console.error('No se inicializó el checkout SUPGO')}
    },150);
  })();<\/script>`;
  html=html.replace(/<head(\s[^>]*)?>/i, match=>match+'<base href="/">');
  if(!/<\/body>/i.test(html))throw Error('La página de origen está incompleta.');
  html=html.replace(/<\/body>/i,bootstrap+'</body>');
  document.open();document.write(html);document.close();
 }catch(error){
  loading.replaceChildren();
  const title=document.createElement('h1');title.textContent='No se pudo cargar el checkout';
  const msg=document.createElement('p');msg.textContent=error.message;
  const link=document.createElement('a');link.href='/carrito/';link.textContent='Volver al carrito';
  loading.append(title,msg,link);
 }
})();
</script></body></html>
