<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar compra | SUPGO</title><style>body{margin:0;font-family:Poppins,Arial,sans-serif;background:#fff}.waiting{text-align:center;margin:14vh auto;padding:24px;max-width:560px;color:#333}.waiting p{font-size:13px;color:#888}</style></head><body><div id="loading" class="waiting"><h2>Finalizar compra</h2><p>Preparando el checkout de SUPGO…</p></div><script>
(async()=>{
 const loading=document.getElementById('loading');
 try{
   // El formulario, sus funciones y sus estilos proceden del mismo catálogo SUPGO.
   // No se crea otro sistema de pedidos ni se modifica la página principal.
   const response=await fetch('/?supgo_checkout_ref=original',{cache:'no-store'});
   if(!response.ok)throw Error('No se pudo cargar el checkout original.');
   let page=await response.text();
   if(!page.includes('id="checkoutModal"')||!page.includes('function openCheckout'))throw Error('No se encontró el checkout original.');
   const injection=`<style id="supgo-checkout-page">
     body.supgo-checkout-page{background:#fff!important;overflow:auto!important}
     body.supgo-checkout-page #checkoutModal{display:grid!important;position:relative!important;inset:auto!important;z-index:1!important;background:#fff!important;padding:0!important;min-height:100vh!important;place-items:start center!important}
     body.supgo-checkout-page #checkoutModal .checkoutCard{position:relative!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border-radius:0!important;width:min(100%,760px)!important;margin:auto!important}
     body.supgo-checkout-page #checkoutModal .checkoutHead{position:relative!important}
     body.supgo-checkout-page #checkoutModal .checkoutHead .close{display:none!important}
     body.supgo-checkout-page #checkoutModal .checkoutBody{padding-bottom:60px!important}
     @media(max-width:760px){body.supgo-checkout-page #checkoutModal .checkoutBody{padding:15px 12px 45px!important}}
   </style>
   <script>(function(){
     const oldCart=JSON.parse(localStorage.getItem('liftCartV2')||'{}');
     const hasItems=Object.values(oldCart).some(q=>Number(typeof q==='object'?(q.quantity??q.qty):q)>0);
     let attempts=0, initialized=false;
     const timer=setInterval(function(){
       if(initialized)return;
       if(typeof window.items!=='function'||typeof window.startCartCheckout!=='function'||typeof window.renderCheckoutSummary!=='function')return;
       const lines=window.items();
       // Esperar a que Supabase cargue los productos; no abrir con un carrito vacío
       // mientras el catálogo todavía se está inicializando.
       if(hasItems&&!lines.length&&++attempts<160)return;
       initialized=true;clearInterval(timer);
       try{
         window.startCartCheckout();
         if(!document.getElementById('checkoutModal').classList.contains('open'))window.openCheckout();
         document.body.classList.add('supgo-checkout-page');
         document.body.style.overflow='auto';
         let el=document.getElementById('checkoutModal');
         while(el&&el!==document.body){
           for(const sibling of el.parentElement.children){
             if(sibling!==el&&sibling.tagName!=='SCRIPT'&&sibling.tagName!=='STYLE')sibling.style.setProperty('display','none','important');
           }
           el=el.parentElement;
         }
         window.renderCheckoutSummary();
         document.title='Finalizar compra | SUPGO';
       }catch(err){console.error('Checkout original:',err);}
     },200);
     setTimeout(function(){if(!initialized){clearInterval(timer);console.error('SUPGO: tiempo de espera agotado al sincronizar los productos');}},38000);
   })();<\/script>`;
   page=page.replace(/<head(\s[^>]*)?>/i,m=>m+'<base href="/">');
   page=page.replace(/<\/body>/i,injection+'</body>');
   document.open();document.write(page);document.close();
 }catch(error){loading.innerHTML='<h2>No se pudo abrir el checkout</h2><p></p><a href="/carrito/">Volver al carrito</a>';loading.querySelector('p').textContent=error.message;}
})();
</script></body></html>
