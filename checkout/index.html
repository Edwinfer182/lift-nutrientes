<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar pedido | SUPGO</title><link rel="stylesheet" href="/paginas/supgo-pages.css"></head><body><header class="topbar"><div class="topinner"><a class="logo" href="/">SUPGO</a><nav class="nav"><a href="/carrito/">Carrito</a><a href="/favoritos/">Favoritos</a><a href="/buscar/">Buscar</a></nav></div></header><main class="site"><h1>Finalizar pedido</h1><p class="muted">Completa tu pedido con el checkout original de SUPGO.</p><p class="notice" id="status">Preparando checkout…</p><div class="iframewrap"><iframe id="catalogModule" title="Finalizar pedido" src="/" loading="eager"></iframe></div></main><script>(function(){const iframe=document.getElementById('catalogModule'),status=document.getElementById('status');let timer;iframe.addEventListener('load',()=>{let attempts=0;timer=setInterval(()=>{let w;try{w=iframe.contentWindow;}catch(e){clearInterval(timer);status.textContent='No se pudo cargar el módulo.';return}if(!w)return;const fn=w.openCheckout;if(typeof fn==='function'&&!!iframe.contentDocument?.getElementById('checkoutModal')){clearInterval(timer);try{fn.call(w);status.hidden=true;iframe.focus()}catch(e){status.textContent='No se pudo abrir el módulo: '+e.message}return}if(++attempts>80){clearInterval(timer);status.textContent='El módulo está tardando. Puedes abrir el catálogo para finalizar tu pedido.'}},200)})})();</script></body></html>
