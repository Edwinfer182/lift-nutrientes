<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Header SUPGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:300 14px Poppins,sans-serif;color:#151515;background:white}button,input{font:inherit}
.top{position:sticky;top:0;z-index:50;background:#080808;border-bottom:1px solid #202020;box-shadow:0 6px 20px #0002}
.bar{max-width:1500px;min-height:66px;margin:auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;flex:none}.liftHeaderLogo{display:block;height:46px;max-width:190px;object-fit:contain}
.search{position:relative;flex:1;min-width:0}.search input{width:100%;height:44px;padding:0 14px;border:1px solid #343434;border-radius:13px;outline:none;background:#181818;color:white}
.search input::placeholder{color:#999}.search input:focus{border-color:#777}
.iconbtn,.offersBtn{height:44px;border-radius:13px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.iconbtn{border:1px solid #303030;background:#111;color:#fff}.offersBtn{border:0;background:#16a34a;color:#fff;font-weight:500}.offersBtn.active{background:#127d38}
.badge,.offersCount{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:50px;font-size:11px;background:#e31b23;color:#fff}.offersCount{background:#fff;color:#168a46}
.filterMobile{display:none}.liftFilterLink{border:0;background:none;color:#fff;cursor:pointer;font-size:17px}
.searchResults{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:80;display:none;max-height:65vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:12px;box-shadow:0 18px 40px #0003}
.searchResults.show{display:block}.searchResult{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:0;border-bottom:1px solid #eee;background:white;text-align:left;cursor:pointer}
.searchResult:hover{background:#f6f6f6}.searchResult img{width:48px;height:48px;object-fit:contain}.searchResult small{display:block;color:#777}
.backdrop{position:fixed;inset:0;background:#0007;z-index:90;display:none}.backdrop.show{display:block}
.drawer{position:fixed;top:0;bottom:0;z-index:91;width:min(390px,92vw);background:#fff;display:none;flex-direction:column;box-shadow:0 0 30px #0003}.drawer.show{display:flex}.drawer.left{left:0}.drawer.right{right:0}
.drawerHead{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}.drawerBody{padding:16px;overflow:auto;flex:1}.drawer button.close{border:0;background:#f2f2f2;border-radius:50%;width:35px;height:35px;cursor:pointer}
.filterOption{display:block;width:100%;text-align:left;padding:11px;border:0;background:#fff;cursor:pointer;border-bottom:1px solid #eee}
.cartRow{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
main{max-width:1200px;margin:25px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.product{border:1px solid #eee;padding:14px;border-radius:8px}.product img{width:100%;height:145px;object-fit:contain}.product h3{font-size:13px;font-weight:400;min-height:40px}.product button{background:#111;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
@media(max-width:760px){.bar{padding:8px;flex-wrap:wrap;gap:7px}.brand{order:1}.liftHeaderLogo{height:38px;max-width:145px}.filterMobile{display:inline-flex;order:2}.offersBtn{order:3;height:40px;padding:0 10px;font-size:12px}.liftFilterLink{display:none}.cartDesktop{order:4;height:40px;padding:0 10px}.search{order:5;flex-basis:100%}.iconbtn .txt{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><style id="header-screenshot-match">
body{background:#0e0f11}main{display:none!important}
.top{background:#0e0f11!important;border:0!important;box-shadow:none!important}
.bar{max-width:1560px!important;min-height:92px!important;padding:18px 22px!important;gap:12px!important}
.brand{width:53px;justify-content:center;margin-right:3px}.liftHeaderLogo{width:46px!important;height:53px!important;max-width:53px!important;object-fit:contain}
.offersBtn{height:45px!important;background:#159d51!important;border-radius:12px!important;padding:0 14px!important;font-weight:600!important;font-size:14px!important;gap:8px!important}
.offersCount{background:#eaffef!important;color:#128745!important;font-weight:600!important}
.search{flex:1!important}.search input{height:46px!important;border:1px solid #34363a!important;border-radius:12px!important;background:#1b1c1e!important;padding-left:41px!important;font-size:13px!important}
.searchGlass{position:absolute;top:50%;left:16px;transform:translateY(-50%);color:#96999e;font-size:23px;line-height:1;pointer-events:none}
.headerOrder,.headerSquare{position:relative;flex:none;background:#141517;color:#fff;border:1px solid #34363a;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;height:46px}
.headerOrder{gap:6px;padding:0 17px;font-size:12px;font-weight:600}.headerSquare{width:46px;padding:0}
.redCount{position:absolute;top:-5px;right:-5px;background:#e31b31;color:#fff;min-width:17px;height:17px;border-radius:20px;font-size:10px;display:grid;place-items:center;padding:0 3px}
.headerOrder:hover,.headerSquare:hover{background:#25272b}
@media(max-width:760px){.bar{padding:10px!important;gap:7px!important;min-height:66px!important}.brand{width:40px;margin-right:auto}.liftHeaderLogo{height:42px!important;width:38px!important}.offersBtn{height:40px!important;padding:0 9px!important;font-size:11px!important}.headerOrder{height:40px;padding:0 9px;font-size:10px}.headerOrder span{display:none}.headerSquare{height:40px;width:40px}.search{order:10!important;flex:1 0 100%!important}.search input{height:42px!important}}
</style></head><body>
<header class="top"><div class="bar">
<a class="brand" href="https://supgo.co/catalogo/" aria-label="Inicio SUPGO"><img class="liftHeaderLogo" src="https://drive.google.com/thumbnail?id=1zAaG9-QksiwKUbDX8ryv3Yy4cIDHt_Ib&sz=w800" alt="SUPGO"></a>
<button class="offersBtn" id="offersButton" onclick="showOffers()">🔥 <span>OFERTAS</span> <span class="offersCount" id="offersCount">21</span></button>
<div class="search"><span class="searchGlass">⌕</span><input type="search" id="q" placeholder="Buscar productos, marcas..." autocomplete="off" aria-label="Buscar productos"><div class="searchResults" id="searchResults"></div></div>
<button class="headerOrder" onclick="openOff('order')">📦 <span>Mi pedido</span></button>
<button class="headerSquare" onclick="openOff('favorites')" aria-label="Favoritos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="redCount" id="favCount">0</span></button>
<button class="headerSquare cartDesktop" onclick="openOff('cart')" aria-label="Carrito"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h2l2.5 12h13l2-9H5"/></svg><span class="redCount" id="count">0</span></button>
</div></header>
<div class="backdrop" id="overlay" onclick="closeOff()"></div>
<aside class="drawer left" id="filters"><div class="drawerHead"><strong>Categorías y marcas</strong><button class="close" onclick="closeOff()">✕</button></div><div class="drawerBody"><strong>Categorías</strong><div id="categories"></div><strong>Marcas</strong><div id="brands"></div></div></aside>
<aside class="drawer right" id="order"><div class="drawerHead"><strong>Mi pedido</strong><button class="close" onclick="closeOff()">✕</button></div><div class="drawerBody"><p>Consulta tus pedidos desde la página de SUPGO.</p><a href="https://supgo.co/catalogo/" target="_blank" rel="noopener">Ir a SUPGO</a></div></aside>
<aside class="drawer right" id="favorites"><div class="drawerHead"><strong>Favoritos</strong><button class="close" onclick="closeOff()">✕</button></div><div class="drawerBody"><p id="favEmpty">No tienes favoritos guardados.</p><div id="favItems"></div></div></aside>
<aside class="drawer right" id="cart"><div class="drawerHead"><strong>Carrito</strong><button class="close" onclick="closeOff()">✕</button></div><div class="drawerBody"><div id="cartItems"></div><p id="cartTotal"></p></div></aside>
<div id="status" role="status" style="position:absolute;left:-9999px"></div>
<script>
'use strict';
// Proyecto público del index suministrado. La llave publishable no es una service_role.
const SB_URL='https://vdxkknftyssjyfbdieqa.supabase.co';
const SB_KEY='sb_publishable_ECuhXuKIb85kj9fgdEjrAw_O7uNpZsh';
const headers={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
let products=[],filter='',offersOnly=false;
const cart=[];
const $=id=>document.getElementById(id);
const txt=v=>String(v??'');
const esc=v=>txt(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(p,...keys)=>{for(const k of keys){if(p[k]!==undefined&&p[k]!==null&&p[k]!=='')return p[k]}return ''};
function normalized(row){
 const p=typeof row.product==='string'?(()=>{try{return JSON.parse(row.product)}catch{return {nombre:row.product}}})():row.product||{};
 const d={...row,...p};
 return {id:row.id,name:txt(pick(d,'nombre','name','producto','titulo','title','Nombre','Producto'))||'Producto',
 brand:txt(pick(d,'marca','brand','laboratorio')),category:txt(pick(d,'categoria','category')),
 price:Number(pick(d,'precio_publico','precio','price','precio_venta')||0),
 image:txt(pick(d,'imagen','image','imagen_url','image_url','foto','url_imagen')),
 offer:Boolean(pick(d,'oferta','en_oferta','is_offer','oferta_activa'))};
}
async function loadProducts(){
 try{
  const all=[];const limit=1000;
  for(let offset=0;offset<10000;offset+=limit){
   const url=SB_URL+'/rest/v1/lift_productos?select=id,product,activo&order=id.asc&limit='+limit+'&offset='+offset;
   const res=await fetch(url,{headers,cache:'no-store'});
   if(!res.ok)throw Error('Supabase HTTP '+res.status);
   const rows=await res.json();all.push(...rows);
   if(rows.length<limit)break;
  }
  products=all.filter(r=>r.activo!==false).map(normalized);
  renderFilters();render(); 
 }catch(e){$('status').textContent='No se pudo cargar el catálogo: '+e.message;console.error(e)}
}
function renderFilters(){
 for(const [id,key] of [['categories','category'],['brands','brand']]){
  const values=[...new Set(products.map(p=>p[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  $(id).replaceChildren();
  for(const v of values){const b=document.createElement('button');b.className='filterOption';b.textContent=v;b.onclick=()=>{filter=v;offersOnly=false;closeOff();render();$('searchResults').classList.add('show')};$(id).append(b)}
 }
 $('offersCount').textContent=products.filter(p=>p.offer).length;
}
function matching(){
 const q=$('q').value.toLocaleLowerCase('es');
 return products.filter(p=>(!offersOnly||p.offer)&&(!filter||p.category===filter||p.brand===filter)&&(!q||(p.name+' '+p.brand+' '+p.category).toLocaleLowerCase('es').includes(q)));
}
function money(v){return Number(v||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0})}
function render(){
 const found=matching();$('status').textContent=found.length+' productos'+(filter?' · '+filter:'');
 $('offersButton').classList.toggle('active',offersOnly);
 renderSearch(found.slice(0,30),offersOnly||Boolean(filter));
}
function renderSearch(items,force=false){
 const box=$('searchResults');box.replaceChildren();
 if(!$('q').value.trim()&&!force){box.classList.remove('show');return}
 for(const p of items){const b=document.createElement('button');b.className='searchResult';
  const img=document.createElement('img');img.src=p.image||'';img.alt='';
  const label=document.createElement('span');label.textContent=p.name;
  const small=document.createElement('small');small.textContent=money(p.price);label.append(small);
  b.append(img,label);b.onclick=()=>{addCart(p.id);box.classList.remove('show')};box.append(b)}
 box.classList.add('show');
}
function showOffers(){offersOnly=!offersOnly;filter='';$('q').value='';render();$('searchResults').classList.toggle('show',offersOnly)}
function openOff(id){$(id).classList.add('show');$('overlay').classList.add('show');if(id==='cart')renderCart()}
function closeOff(){document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('show'));$('overlay').classList.remove('show')}
function addCart(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const line=cart.find(x=>x.id===p.id);if(line)line.qty++;else cart.push({...p,qty:1});renderCart()}
function renderCart(){
 $('count').textContent=cart.reduce((s,p)=>s+p.qty,0);
 $('cartItems').replaceChildren();
 for(const p of cart){const div=document.createElement('div');div.className='cartRow';
 const name=document.createElement('span');name.textContent=p.name+' × '+p.qty;
 const price=document.createElement('span');price.textContent=money(p.price*p.qty);
 div.append(name,price);$('cartItems').append(div)}
 $('cartTotal').textContent='Total: '+money(cart.reduce((s,p)=>s+p.price*p.qty,0));
}
async function liftCopyFilterLink(type,value){
 const url=new URL(location.href);url.searchParams.set(type,value);
 try{await navigator.clipboard.writeText(url.toString());alert('Enlace copiado')}catch{prompt('Copia el enlace:',url.toString())}
}
$('q').addEventListener('input',()=>{filter='';offersOnly=false;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOff();$('searchResults').classList.remove('show')}});
loadProducts();
</script></body></html>
