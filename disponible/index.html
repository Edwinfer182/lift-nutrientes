<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Confirmar disponibilidad | SUPGO</title>
<link rel="icon" type="image/png" href="/favicon.png?v=supgo-rounded-2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--muted:#6b6b6b;--line:#e6e6e6;--soft:#f6f6f4;--green:#159f50;--green-soft:#eaf7ee;--red:#b42318;--red-soft:#fff4f2;--lime:#c8f34b;--radius:16px}
*{box-sizing:border-box}
body{margin:0;background:#f3f3f1;color:var(--ink);font:15px/1.45 Poppins,system-ui,-apple-system,Arial,sans-serif}
header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{letter-spacing:3px;font-size:18px}header a{color:var(--lime);font-size:12px;font-weight:600;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:13px;letter-spacing:1px;color:var(--muted);margin:26px 0 10px;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.main{border:2px solid var(--ink)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top b{font-size:17px}.top small{display:block;color:var(--muted);font-size:12px}
.total{font-weight:700;font-size:17px;white-space:nowrap}
.items{margin:12px 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:14px;line-height:1.6}
.items span{color:var(--muted);font-size:12px}
.meta{font-size:12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button,.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:12px;font:700 15px Poppins,Arial,sans-serif;cursor:pointer;text-decoration:none;border:0;width:100%}
.ok{background:var(--green);color:#fff}.no{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.ok.sel{box-shadow:0 0 0 4px #bfe8cf}.no.sel{box-shadow:0 0 0 4px #f6c9c4}
.wa{background:#25d366;color:#fff;margin-top:10px}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px;height:44px;font-size:13px}
button:disabled{opacity:.55;cursor:wait}
.confirm{display:none;margin-top:10px;padding:12px;border-radius:12px;background:var(--soft);font-size:14px}
.confirm.on{display:block}
.confirm .acts{margin-top:8px}
.done{border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.done.ok2{background:var(--green-soft);color:#14532d}.done.no2{background:var(--red-soft);color:#7a1d14}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:6px;background:#fff3c4;color:#6b4a00}
.badge.g{background:var(--green-soft);color:var(--green)}.badge.r{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:16px;font-size:14px}
.err{background:var(--red-soft);color:var(--red);padding:14px;border-radius:12px}
.sk{height:180px;border-radius:var(--radius);background:linear-gradient(90deg,#ececea,#f6f6f4,#ececea);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<header><b>SUPGO</b><a href="/admin.html">Abrir panel →</a></header>
<main id="app"><div class="sk"></div></main>
<script>
(function(){
'use strict';
var FN='https://vdxkknftyssjyfbdieqa.supabase.co/functions/v1/lift-clientes',KEY='sb_publishable_ECuhXuKIb85kj9fgdEjrAw_O7uNpZsh';
var q=new URLSearchParams(location.search),P=q.get('p')||'',K=q.get('k')||'',PRE=q.get('a')||'';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return '$ '+Math.round(Number(n)||0).toLocaleString('es-CO')};
var orders={};
function api(body){return fetch(FN,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok||j.error)throw new Error(j.error||'No se pudo completar');return j})})}
function waNum(c){var n=String(c||'').replace(/\D/g,'');if(n.length===10)n='57'+n;return n}
function first(n){return String(n||'').trim().split(/\s+/)[0]||''}
function waLink(o,ok){
  var url='https://supgo.co/mi-pedido/?pedido='+o.id+'&token='+encodeURIComponent(o.token||'');
  var t=ok?'Hola '+first(o.nombre)+', ¡buenas noticias! Ya confirmamos que tus productos están disponibles 🙌 Paga desde este enlace para que preparemos tu pedido de una vez.\n\nPedido #'+o.id+' · Total '+money(o.total)+'\n'+url
         :'Hola '+first(o.nombre)+', te escribo de SUPGO por tu pedido #'+o.id+'. Lamentablemente en este momento no tenemos disponible '+(o.items.length>1?'uno de los productos':'el producto')+'. No se ha hecho ningún cobro. ¿Quieres que te ofrezca una alternativa?';
  var n=waNum(o.celular);return 'https://wa.me/'+(n||'')+'?text='+encodeURIComponent(t);
}
function status(o){
  if(o.estado==='verificando_disponibilidad')return '<span class="badge">Esperando confirmación</span>';
  if(o.estado==='pendiente_pago')return '<span class="badge g">✓ Disponible · pago habilitado</span>';
  if(o.estado==='sin_disponibilidad')return '<span class="badge r">✕ Sin disponibilidad</span>';
  return '<span class="badge g">'+esc(o.estado)+'</span>';
}
function card(o,main){
  orders[o.id]=o;
  var pending=o.estado==='verificando_disponibilidad';
  var h='<div class="card'+(main?' main':'')+'" id="o'+o.id+'"><div class="top"><div><b>Pedido #'+o.id+'</b><small>'+esc(o.nombre)+' · '+esc(o.ciudad||'')+' · '+new Date(o.fecha).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'</small>'+status(o)+'</div><div class="total">'+money(o.total)+'</div></div>'
   +'<div class="items">'+o.items.map(function(i){return esc(i.cantidad)+' × '+esc(i.nombre)+(i.marca?' <span>· '+esc(i.marca)+'</span>':'')}).join('<br>')+'</div>'
   +(main&&o.direccion?'<div class="meta">📍 '+esc(o.direccion)+(o.notas?' · '+esc(o.notas):'')+'</div>':'');
  if(pending){
    h+='<div class="acts"><button class="ok'+(main&&PRE==='si'?' sel':'')+'" data-ask="1" data-id="'+o.id+'">✓ Disponible</button><button class="no'+(main&&PRE==='no'?' sel':'')+'" data-ask="0" data-id="'+o.id+'">✕ Falta</button></div>'
      +'<div class="confirm" id="c'+o.id+'"></div>';
  }else{
    h+=afterHtml(o);
  }
  return h+'</div>';
}
function afterHtml(o){
  var ok=o.estado==='pendiente_pago';
  if(o.estado!=='pendiente_pago'&&o.estado!=='sin_disponibilidad')return '';
  return '<div class="done '+(ok?'ok2':'no2')+'">'+(ok?'✓ Pago habilitado. Si el cliente dejó correo, ya le llegó el aviso para pagar.':'✕ Marcado sin disponibilidad. Si el cliente dejó correo, ya le llegó el aviso.')+'</div>'
    +'<a class="btn wa" target="_blank" rel="noopener" href="'+esc(waLink(o,ok))+'">📲 '+(ok?'Avisarle para que pague':'Escribirle por WhatsApp')+'</a>';
}
function ask(id,yes){
  var c=$('c'+id),o=orders[id];if(!c)return;
  c.className='confirm on';
  c.innerHTML=(yes?'¿Confirmas que <b>todo está disponible</b>? Se habilita el pago y le llega el correo a '+esc(first(o.nombre))+'.':'¿Confirmas que <b>falta producto</b>? Se le avisará a '+esc(first(o.nombre))+' que no hay disponibilidad.')
    +'<div class="acts"><button class="ghost" data-cancel="'+id+'" style="margin:0">Cancelar</button><button class="'+(yes?'ok':'no')+'" data-do="'+(yes?1:0)+'" data-id="'+id+'">Sí, confirmar</button></div>';
}
function act(id,yes,btn){
  var o=orders[id];btn.disabled=true;btn.textContent='Guardando…';
  api({action:'quick-availability',p:id,k:o.k,disponible:!!yes}).then(function(j){
    var n=j.pedido;orders[id]=n;var el=$('o'+id);
    el.outerHTML=card(n,el.classList.contains('main'));
    if(j.ya)toast('Este pedido ya estaba actualizado.');
    var a=$('o'+id).querySelector('.wa');if(a)a.scrollIntoView({behavior:'smooth',block:'center'});
  }).catch(function(e){btn.disabled=false;btn.textContent='Sí, confirmar';alert(e.message)});
}
function toast(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:9';document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.ask!=null)ask(Number(b.dataset.id),b.dataset.ask==='1');
  else if(b.dataset.cancel){var c=$('c'+b.dataset.cancel);c.className='confirm';c.innerHTML=''}
  else if(b.dataset.do!=null)act(Number(b.dataset.id),b.dataset.do==='1',b);
});
function load(){
  if(!/^\d+$/.test(P)||!/^[0-9a-f]{32}$/.test(K)){$('app').innerHTML='<div class="err">Este enlace no es válido. Ábrelo desde el correo del pedido.</div>';return}
  api({action:'quick-view',p:Number(P),k:K}).then(function(j){
    var h=card(j.pedido,true);
    h+='<h2>Otros pedidos esperando confirmación ('+j.pendientes.length+')</h2>';
    h+=j.pendientes.length?j.pendientes.map(function(o){return card(o,false)}).join(''):'<div class="card empty">No hay más pedidos pendientes 🙌</div>';
    $('app').innerHTML=h;
    if(PRE==='si'||PRE==='no'){if(j.pedido.estado==='verificando_disponibilidad')ask(j.pedido.id,PRE==='si')}
  }).catch(function(e){$('app').innerHTML='<div class="err">'+esc(e.message)+'</div>'});
}
load();
})();
</script>
</body>
</html>
