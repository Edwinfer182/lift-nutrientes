      const norm = s => String(s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/[^a-z0-9]+/g,' ')
        .replace(/\s+/g,' ')
        .trim();

      const list = [
        frame.contentWindow && frame.contentWindow.PRODUCTS,
        frame.contentWindow && frame.contentWindow.products,
        frame.contentWindow && frame.contentWindow.catalogProducts,
        frame.contentWindow && frame.contentWindow.CATALOG_PRODUCTS
      ].find(Array.isArray);

      if (list) {
        for (const s of SPECS) {
          const wantedName = norm(s.name);
          const wantedPresentation = norm(s.presentation);
          let p = list.find(x => {
            const brand = norm(x.brand || x.marca || '');
            const text = norm(`${x.name || x.nombre || ''} ${x.presentation || x.presentacion || ''}`);
            return brand.includes('insane labz') &&
                   text.includes(wantedName) &&
                   text.includes(wantedPresentation);
          });

          if (!p) {
            p = {};
            list.push(p);
          }

          Object.assign(p, {
            id: s.id,
            name: s.name,
            nombre: s.name,
            presentation: s.presentation,
            presentacion: s.presentation,
            brand: s.brand,
            marca: s.brand,
            category: s.category,
            categoria: s.category,
            price: s.price,
            precio: s.price,
            image: s.image,
            imagen: s.image
          });
        }
        doc.documentElement.dataset.liftInsaneEmbedded = 'ready';
      }

      const script = doc.createElement('script');
      script.src = src;
      script.setAttribute(attr, '1');
      doc.body.appendChild(script);
    };
