<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Nutrientes</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#catalogo{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="catalogo" src="./catalogo-base.html" title="Catálogo Lift Nutrientes"></iframe>
<script>
(() => {
  const frame = document.getElementById('catalogo');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    const inject = (src, attr) => {
      if (doc.querySelector(`script[${attr}]`)) return;
      const script = doc.createElement('script');
      script.src = src;
      script.setAttribute(attr, '1');
      doc.body.appendChild(script);
    };
    inject('./proteinas-subcategorias.js?v=13', 'data-lift-protein-subcategories');
    inject('./imagenes-tarjetas-ui.js?v=2', 'data-lift-card-image-size');
    inject('./creatinas-imagenes-drive.js?v=3', 'data-lift-creatine-drive-images');
    inject('./applied-nutrition-imagenes-drive.js?v=2', 'data-lift-applied-nutrition-drive-images');
    inject('./producto-offcanvas-ui.js?v=4', 'data-lift-product-offcanvas');
  });
})();
</script>
</body>
</html>
