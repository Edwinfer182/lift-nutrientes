<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Nutrientes</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#catalogo{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="catalogo" src="./catalogo-base.html" title="Catálogo Lift Nutrientes"></iframe>
<script>
(() => {
  const frame = document.getElementById('catalogo');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    const inject = (src, attr) => {
      if (doc.querySelector(`script[${attr}]`)) return;
      const script = doc.createElement('script');
      script.src = src;
      script.setAttribute(attr, '1');
      doc.body.appendChild(script);
    };
    inject('./imagenes-asociacion-segura.js?v=1', 'data-lift-safe-image-groups');
    inject('./marca-en-tarjetas.js?v=2', 'data-lift-card-brand');
    inject('./proteinas-subcategorias.js?v=13', 'data-lift-protein-subcategories');
    inject('./imagenes-tarjetas-ui.js?v=2', 'data-lift-card-image-size');
    inject('./creatinas-imagenes-drive.js?v=4', 'data-lift-creatine-drive-images');
    inject('./applied-nutrition-imagenes-drive.js?v=3', 'data-lift-applied-nutrition-drive-images');
    inject('./basic-supplements-imagenes-drive.js?v=2', 'data-lift-basic-supplements-drive-images');
    inject('./bsn-imagenes-drive.js?v=1', 'data-lift-bsn-drive-images');
    inject('./cellucor-imagenes-drive.js?v=1', 'data-lift-cellucor-drive-images');
    inject('./darkness-imagenes-drive.js?v=1', 'data-lift-darkness-drive-images');
    inject('./dragon-pharma-imagenes-drive.js?v=3', 'data-lift-dragon-pharma-drive-images');
    inject('./dymatize-imagenes-drive.js?v=2', 'data-lift-dymatize-drive-images');
    inject('./elite-pharma-imagenes-drive.js?v=1', 'data-lift-elite-pharma-drive-images');
    inject('./enhanced-athlete-imagenes-drive.js?v=1', 'data-lift-enhanced-athlete-drive-images');
    inject('./hard-supps-imagenes-drive.js?v=4', 'data-lift-hard-supps-drive-images');
    inject('./healthy-sports-imagenes-drive.js?v=2', 'data-lift-healthy-sports-drive-images');
    inject('./hi-tech-pharma-imagenes-drive.js?v=2', 'data-lift-hi-tech-pharma-drive-images');
    inject('./healthy-sports-deduplicar.js?v=1', 'data-lift-healthy-sports-dedupe');
    inject('./producto-offcanvas-ui.js?v=5', 'data-lift-product-offcanvas');
  });
})();
</script>
</body>
</html>
