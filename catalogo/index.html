<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Nutrientes</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#catalogo{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="catalogo" src="./catalogo-base.html" title="Catálogo Lift Nutrientes"></iframe>
<script>
(() => {
  const frame = document.getElementById('catalogo');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.querySelector('script[data-lift-protein-subcategories]')) return;
    const script = doc.createElement('script');
    script.src = './proteinas-subcategorias.js?v=10';
    script.dataset.liftProteinSubcategories = '1';
    doc.body.appendChild(script);
  });
})();
</script>
</body>
</html>
