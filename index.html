<script>
(function(){
  var q=new URLSearchParams(location.search);
  if((q.get('admin')||'').toLowerCase()==='lift'){location.replace('/admin.html?admin=lift');return;}
  // Consultas de pedido, enlaces de correos, regreso de Bold y enlaces antiguos
  // (?mi-pedido=1, ?pedido=, categoria, marca, producto...) los atiende la aplicación completa.
  // Antes se perdían al redirigir a /home/ y "Mi pedido" no abría nada.
  ['fbclid','gclid','gbraid','wbraid','msclkid','ttclid','igshid','_ga'].forEach(function(k){q.delete(k);});
  Array.from(q.keys()).forEach(function(k){if(/^utm_/i.test(k))q.delete(k);});
  if(q.has('pedido')||q.has('mi-pedido')){location.replace('/mi-pedido/'+location.search+location.hash);return;}
  if(Array.from(q.keys()).length){location.replace('/admin.html'+location.search+location.hash);return;}
  location.replace('/home/'+location.hash);
})();
</script>
