<style>
/* Mantener enlaces HTML para Google y visitantes sin JavaScript, sin mostrarlos durante la hidratación. */
html.js-coleccion #content > .seo-productos { display: none; }
html.js-coleccion #content:has(> .seo-productos)::before {
  content: "Cargando productos…";
  display: block;
  min-height: 180px;
  padding: 24px 16px;
  border-radius: 12px;
  color: #657269;
  background: linear-gradient(110deg,#f4f5f5 8%,#e6eae8 18%,#f4f5f5 33%);
  background-size: 200% 100%;
  animation: supgo-skeleton 1.6s linear infinite;
}
@keyframes supgo-skeleton { to { background-position-x: -200%; } }
@media (prefers-reduced-motion: reduce) {
  html.js-coleccion #content:has(> .seo-productos)::before { animation: none; }
}
</style>
<script>document.documentElement.classList.add('js-coleccion');</script>
</head>
<body data-page="laboratorio" data-slug="@@SLUG@@">
<main class="site">
  @@BREADCRUMB@@
  <h1>@@HEADING@@</h1>

  <div class="toolbar"><span class="conteo" id="conteo">@@COUNT@@</span><label for="sort" class="sr-only">Ordenar</label><select id="sort" onchange="window.supgoPages?.render()"><option value="">Ordenar: nombre</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="serv">Menor precio por servicio</option></select></div>
  <div class="filtros" id="filtros" hidden></div>
  <div id="content">@@INITIAL_PRODUCTS@@</div>
  @@BOTTOM@@
</main>
<script defer src="/paginas/supgo-pages.js?v=20261107-col" onerror="document.documentElement.classList.remove('js-coleccion')"></script>

</body></html>
