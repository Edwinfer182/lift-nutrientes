<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Mis pedidos | SUPGO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#141414;font:14px Poppins,Arial,sans-serif}main{max-width:850px;margin:44px auto;padding:0 20px}h1{font-size:32px;margin:0 0 14px}p{color:#666}form{border:1px solid #e4e4e4;border-radius:13px;padding:24px;margin-top:24px} .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600;display:block;margin-bottom:7px}input{width:100%;border:1px solid #ccc;border-radius:8px;padding:14px;font:inherit;font-size:16px}button,.action{background:#141414;color:white;border:0;border-radius:8px;padding:13px 20px;font:600 13px Poppins;cursor:pointer;text-decoration:none;display:inline-block;margin-top:17px}.message{margin-top:18px;line-height:1.6}.result{margin-top:20px;padding:20px;border:1px solid #ddd;border-radius:12px}.result strong{display:block;margin-bottom:8px}@media(max-width:600px){main{margin:26px auto}h1{font-size:27px}.fields{grid-template-columns:1fr}form{padding:18px}}
</style></head><body><main><h1>Mis pedidos</h1><p>Consulta el estado de tu compra con el número de pedido y el celular registrado al comprar.</p><form id="lookup"><div class="fields"><div><label for="order">Número de pedido</label><input id="order" placeholder="Ej. 12345" required maxlength="80" autocomplete="off"></div><div><label for="phone">Celular de la compra</label><input id="phone" type="tel" inputmode="tel" placeholder="Número registrado" required maxlength="25" autocomplete="tel"></div></div><button id="submit" type="submit">Consultar pedido</button><div id="message" class="message" role="status" aria-live="polite"></div></form><section id="result" hidden class="result"></section></main><script src="/componentes/header-loader.js?v=20261022-header-existing4"></script><script>
(()=>{'use strict';
const endpoint='https://vdxkknftyssjyfbdieqa.supabase.co/functions/v1/lift-clientes';
const form=document.getElementById('lookup'),msg=document.getElementById('message'),result=document.getElementById('result'),submit=document.getElementById('submit');
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v)||0);
const labels={verificando_disponibilidad:'Verificando disponibilidad',pendiente_pago:'Pendiente de pago',preparando:'Preparando pedido',en_ruta:'En ruta',entregado:'Entregado',cancelado:'Cancelado'};
function field(name,value){if(value===null||value===undefined||value==='')return;const p=document.createElement('p'),b=document.createElement('b');b.textContent=name+': ';p.append(b,document.createTextNode(String(value)));result.append(p);}
function render(p){result.replaceChildren();result.hidden=false;const title=document.createElement('h2');title.textContent=p.referencia||'Tu pedido';result.append(title);field('Estado',labels[p.estado]||p.estado||'Recibido');field('Cliente',p.nombre);field('Fecha',p.fecha?new Date(p.fecha).toLocaleDateString('es-CO'):null);field('Total',money(p.total));field('Pago',p.pago_estado);if(Array.isArray(p.items)&&p.items.length){const h=document.createElement('h3');h.textContent='Productos';result.append(h);for(const item of p.items){field((item.nombre||'Producto')+' × '+(item.cantidad||1),money(item.total_linea));}}
const steps=['verificando_disponibilidad','pendiente_pago','preparando','en_ruta','entregado'];const current=steps.indexOf(p.estado);if(current>=0){const h=document.createElement('h3');h.textContent='Seguimiento';result.append(h);for(let i=0;i<steps.length;i++){const div=document.createElement('p');div.textContent=(i<current?'✓ ':i===current?'● ':'○ ')+labels[steps[i]];div.style.color=i<=current?'#141414':'#999';result.append(div);}}
if(p.token){const a=document.createElement('a');a.className='action';a.href='/mis-pedidos/?pedido='+encodeURIComponent(p.referencia)+'&token='+encodeURIComponent(p.token);a.textContent='Enlace de seguimiento';result.append(a);}
}
async function lookup(referencia,celular,token){result.hidden=true;result.replaceChildren();msg.textContent='Consultando pedido…';submit.disabled=true;try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public-track-order',referencia,celular,token})});const data=await response.json();if(!response.ok||!data.ok||!data.pedido)throw Error(data.error||'No encontramos un pedido con esos datos.');msg.textContent='Pedido encontrado';render(data.pedido);}catch(e){msg.textContent=e.message||'No fue posible consultar el pedido.';}finally{submit.disabled=false;}}
form.addEventListener('submit',e=>{e.preventDefault();const referencia=document.getElementById('order').value.trim(),celular=document.getElementById('phone').value.trim();if(!referencia||celular.replace(/\D/g,'').length<7){msg.textContent='Ingresa un pedido y un celular válido.';return;}lookup(referencia,celular,'');});
const params=new URLSearchParams(location.search),ref=params.get('pedido')||params.get('referencia'),token=params.get('token');if(ref&&token){document.getElementById('order').value=ref;document.getElementById('phone').required=false;lookup(ref,'',token);}
})();
</script></body></html>
