<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Mis pedidos | SUPGO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#141414;font:14px Poppins,Arial,sans-serif}main{max-width:850px;margin:44px auto;padding:0 20px}h1{font-size:32px;margin:0 0 14px}p{color:#666}form{border:1px solid #e4e4e4;border-radius:13px;padding:24px;margin-top:24px} .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600;display:block;margin-bottom:7px}input{width:100%;border:1px solid #ccc;border-radius:8px;padding:14px;font:inherit;font-size:16px}button,.action{background:#141414;color:white;border:0;border-radius:8px;padding:13px 20px;font:600 13px Poppins;cursor:pointer;text-decoration:none;display:inline-block;margin-top:17px}.message{margin-top:18px;line-height:1.6}.result{margin-top:20px;padding:20px;border:1px solid #ddd;border-radius:12px}.result strong{display:block;margin-bottom:8px}@media(max-width:600px){main{margin:26px auto}h1{font-size:27px}.fields{grid-template-columns:1fr}form{padding:18px}}
</style></head><body><main><h1>Mis pedidos</h1><p>Consulta el estado de tu compra con el número de pedido y el celular registrado al comprar.</p><form id="lookup"><div class="fields"><div><label for="order">Número de pedido</label><input id="order" placeholder="Ej. 12345" required maxlength="80" autocomplete="off"></div><div><label for="phone">Celular de la compra</label><input id="phone" type="tel" inputmode="tel" placeholder="Número registrado" required maxlength="25" autocomplete="tel"></div></div><button id="submit" type="submit">Consultar pedido</button><div id="message" class="message" role="status" aria-live="polite"></div></form><section id="result" hidden class="result"></section></main><script src="/componentes/header-loader.js"></script><script>
(()=>{'use strict';
const base='https://vdxkknftyssjyfbdieqa.supabase.co/rest/v1/lift_pedidos',key='sb_publishable_ECuhXuKIb85kj9fgdEjrAw_O7uNpZsh';
const form=document.querySelector('#lookup'),msg=document.querySelector('#message'),result=document.querySelector('#result'),submit=document.querySelector('#submit');
const fields=[['numero_pedido','celular'],['numero','telefono'],['id','telefono'],['id','celular'],['numero_pedido','telefono'],['pedido_numero','celular']];
const phoneDigits=s=>String(s||'').replace(/\D/g,'');
const equal=(a,b)=>phoneDigits(a)===phoneDigits(b)||phoneDigits(a).slice(-10)===phoneDigits(b).slice(-10)&&phoneDigits(b).length>=10;
function pick(o,keys){for(const k of keys)if(o[k]!=null&&o[k]!=='')return o[k];return null;}
function clear(){result.hidden=true;result.replaceChildren();}
function line(title,value){const p=document.createElement('p');const b=document.createElement('b');b.textContent=title+': ';p.append(b,document.createTextNode(String(value)));result.append(p);}
form.addEventListener('submit',async e=>{e.preventDefault();clear();const number=document.querySelector('#order').value.trim(),phone=phoneDigits(document.querySelector('#phone').value);if(!number||phone.length<7){msg.textContent='Ingresa un número de pedido y un celular válido.';return;}submit.disabled=true;msg.textContent='Consultando pedido…';let found=null,reachable=false;
try{for(const [idCol,phoneCol] of fields){const u=new URL(base);u.searchParams.set('select','*');u.searchParams.set(idCol,'eq.'+number);u.searchParams.set(phoneCol,'eq.'+phone);u.searchParams.set('limit','2');const r=await fetch(u,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok){if(r.status===400)continue;throw new Error('No se pudo consultar el servicio de pedidos.');}reachable=true;const rows=await r.json();found=rows.find(x=>equal(pick(x,[phoneCol,'telefono','celular','telefono_cliente','celular_cliente']),phone));if(found)break;}
if(!found){msg.textContent=reachable?'No encontramos un pedido con esos datos. Comprueba el número y el celular.':'La consulta de pedidos no está disponible en este momento.';return;}
msg.textContent='Pedido encontrado.';result.hidden=false;const id=pick(found,['numero_pedido','numero','pedido_numero','id'])||number;const status=pick(found,['estado','estado_pedido','status'])||'Registrado';const token=pick(found,['token_publico','public_token','token']);const h=document.createElement('strong');h.textContent='Pedido #'+id;result.append(h);line('Estado',status);const date=pick(found,['created_at','fecha','fecha_pedido']);if(date)line('Fecha',new Date(date).toLocaleDateString('es-CO'));if(token){const a=document.createElement('a');a.className='action';a.href='/mi-pedido/?token='+encodeURIComponent(token);a.textContent='Ver seguimiento del pedido';result.append(a);}
}catch(err){msg.textContent='No fue posible consultar tu pedido. Intenta nuevamente.';console.error('Consulta de pedidos',err);}finally{submit.disabled=false;}
});
})();
</script></body></html>
