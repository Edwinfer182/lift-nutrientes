<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111111">
<title>Entrega SUPGO</title>
<link rel="icon" type="image/png" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--bg:#f2f3f2;--green:#15803d;--lime:#c8f34b;--red:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
.top{background:var(--ink);color:#fff;padding:14px 18px calc(14px);display:flex;align-items:center;gap:12px}
.top img{width:36px;height:36px;border-radius:9px}
.top b{font-size:18px;display:block;line-height:1.2}
.top small{color:#d4d4d4;font-size:13px}
.chip{margin-left:auto;background:var(--lime);color:var(--ink);font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.done{background:#bbf7d0}
main{max-width:560px;margin:0 auto;padding:14px 14px 130px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.name{font-size:20px;font-weight:700;margin:0 0 2px}
.addr{font-size:17px;font-weight:500;margin:10px 0 2px}
.city{color:var(--ink2);margin:0}
.notes{background:#fef9c3;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;padding:0 8px}
.btn.wa{background:#f0fdf4;border-color:#bbf7d0;color:#128c4b}
.item{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #f1f1f1}
.item:first-of-type{border-top:0}
.item img,.item .ph{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#f6f6f6;flex:none}
.item b{display:block;font-weight:500;line-height:1.3}
.item small{color:var(--muted)}
.qty{margin-left:auto;font-weight:700;font-size:18px;white-space:nowrap}
.nopay{background:#111;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;font-weight:600;display:flex;gap:10px;align-items:center}
.nopay span{color:var(--lime);font-size:22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.big{width:100%;min-height:62px;border:0;border-radius:16px;font-size:20px;font-weight:700;color:#fff;background:var(--ink);cursor:pointer}
.big.go{background:var(--green)}
.big:disabled{opacity:.6}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:7px 0 0}
.msg{text-align:center;padding:60px 20px}
.msg b{display:block;font-size:20px;margin-bottom:6px}
.ok{background:#dcfce7;color:#14532d;border-radius:16px;padding:16px;text-align:center;font-weight:600;margin-bottom:12px}
.confirm{display:none;gap:8px;grid-template-columns:1fr 1fr}
.confirm.on{display:grid}
.confirm .big{font-size:17px;min-height:56px}
.confirm .no{background:#fff;color:var(--ink);border:1px solid var(--line)}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#e9e9e9,#f6f6f6,#e9e9e9);background-size:200% 100%;animation:s 1.2s infinite;margin-bottom:12px}
@keyframes s{to{background-position:-200% 0}}
</style>
</head>
<body>
<header class="top"><img src="/favicon.png" alt="" width="36" height="36"><div><b id="ref">SUPGO</b><small>Entrega de pedido</small></div><span class="chip" id="chip" hidden></span></header>
<main id="app"><div class="skel"></div><div class="skel"></div></main>
<div class="bar" id="bar" hidden><div class="in">
  <button class="big go" id="act" type="button"></button>
  <div class="confirm" id="conf"><button class="big no" id="cNo" type="button">Volver</button><button class="big go" id="cYes" type="button"></button></div>
  <p class="hint" id="hint"></p>
</div></div>
<script>
(function(){
const FN='https://vdxkknftyssjyfbdieqa.supabase.co/functions/v1/lift-clientes',KEY='sb_publishable_ECuhXuKIb85kj9fgdEjrAw_O7uNpZsh';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
let code=(q.get('c')||'').trim();
if(!code){const k=[...q.keys()][0]||'';if(/^[A-Za-z0-9]{7}$/.test(k))code=k}
if(!code){const m=location.pathname.match(/\/e\/([A-Za-z0-9]{7})\/?$/);if(m)code=m[1]}
code=code.toUpperCase();
async function api(body){
  const r=await fetch(FN,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({...body,code})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'No se pudo conectar. Intenta de nuevo.'),{status:r.status});
  return j;
}
function fail(t,d){$('app').innerHTML='<div class="msg"><b>'+esc(t)+'</b>'+esc(d||'')+'</div>';$('bar').hidden=true}
let order=null,busy=false;
function phoneDigits(v){let n=String(v||'').replace(/\D/g,'');if(n.length===12&&n.startsWith('57'))n=n.slice(2);return n}
function render(){
  const p=order,c=p.cliente||{},cel=phoneDigits(c.celular),st=p.estado;
  const route=st==='en_ruta',done=st==='entregado';
  $('ref').textContent='Pedido #'+p.id;
  const chip=$('chip');chip.hidden=false;chip.className='chip'+(done?' done':'');chip.textContent=done?'ENTREGADO':route?'EN RUTA':'POR SALIR';
  const where=[p.direccion,p.ciudad].filter(Boolean).join(', ');
  $('app').innerHTML=
   (done?'<div class="ok">✓ Pedido entregado. ¡Gracias!</div>':route?'<div class="ok">🚚 Pedido en ruta. Cuando lo entregues, toca «Entregado».</div>':'')+
   '<div class="card"><h2>CLIENTE</h2><p class="name">'+esc(c.nombre||'Cliente')+'</p>'+
   '<p class="addr">'+esc(p.direccion||'')+'</p><p class="city">'+esc(p.ciudad||'')+'</p>'+
   (p.notas?'<div class="notes">'+esc(p.notas)+'</div>':'')+
   '<div class="row">'+
    (cel?'<a class="btn" href="tel:'+cel+'">📞 Llamar</a><a class="btn wa" href="https://wa.me/57'+cel+'" target="_blank" rel="noopener">WhatsApp</a>':'')+
    '<a class="btn" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(where)+'" target="_blank" rel="noopener"'+(cel?'':' style="grid-column:1/-1"')+'>📍 Mapa</a>'+
   '</div></div>'+
   '<div class="nopay"><span>$0</span>No cobrar al cliente. El pago lo maneja SUPGO.</div>'+
   '<div class="card"><h2>PRODUCTOS</h2>'+(p.items||[]).map(x=>'<div class="item">'+(x.imagen?'<img src="'+esc(x.imagen)+'" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph\'}))">':'<div class="ph"></div>')+'<div><b>'+esc(x.nombre||'Producto')+'</b>'+(x.marca?'<small>'+esc(x.marca)+'</small>':'')+'</div><span class="qty">x'+Number(x.cantidad||1)+'</span></div>').join('')+'</div>';
  $('bar').hidden=done;
  $('conf').classList.remove('on');$('act').hidden=false;
  if(!done){
    $('act').textContent=route?'✓ Entregado':'🚚 Ya salió';
    $('act').className='big'+(route?'':' go');
    $('hint').textContent=route?'Tócalo cuando el cliente reciba el pedido.':'Tócalo cuando salgas con el pedido.';
  }
}
function ask(){
  const route=order.estado==='en_ruta';
  $('act').hidden=true;$('conf').classList.add('on');
  $('cYes').textContent=route?'Sí, entregado':'Sí, ya salí';
  $('hint').textContent=route?'¿Confirmas que el cliente recibió el pedido?':'¿Confirmas que ya saliste con el pedido?';
}
async function send(){
  if(busy)return;busy=true;$('cYes').disabled=true;
  const estado=order.estado==='en_ruta'?'entregado':'en_ruta';
  try{
    await api({action:'courier-status',estado,...(estado==='entregado'?{entrega_tipo:'directa'}:{})});
    order.estado=estado;render();window.scrollTo(0,0);
  }catch(e){$('hint').textContent=e.message;}
  finally{busy=false;$('cYes').disabled=false}
}
$('act').onclick=ask;$('cNo').onclick=render;$('cYes').onclick=send;
async function load(){
  if(!/^[A-Z0-9]{7}$/.test(code))return fail('Enlace incompleto','Pide de nuevo el enlace a SUPGO.');
  try{const j=await api({action:'courier-view'});order=j.pedido;render()}
  catch(e){fail(e.status===410?'Pedido cerrado':e.status===404?'Enlace no válido':'Sin conexión',e.status===404?'Pide de nuevo el enlace a SUPGO.':e.message)}
}
load();
})();
</script>
</body>
</html>
