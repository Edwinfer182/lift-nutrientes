<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Proveedores · SUPGO CONTROL</title>
<link rel="icon" type="image/png" href="/favicon.png?v=supgo-rounded-2">
<link rel="preconnect" href="https://vdxkknftyssjyfbdieqa.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../catalogo/app.css?v=2">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="topRow">
      <div class="brand"><span class="logo">💼</span><div><h1>Proveedores</h1><p id="sync" class="sync"><i></i><span>Conectando…</span></p></div></div>
      <div class="field grow searchIn"><input id="q" type="search" placeholder="Buscar proveedor, cliente o referencia…" autocomplete="off"></div>
      <button class="btn primary" id="newProv" type="button"><span>＋</span><b>Proveedor</b></button>
    </div>
    <nav class="tabs" id="tabs"><a href="#cuentas" data-s="cuentas">Cuentas</a><a href="#movimientos" data-s="movimientos">Movimientos</a><a href="#catalogos" data-s="catalogos">Catálogos PDF</a></nav>
  </header>
  <main>
    <section class="sec" id="s-cuentas">
      <div class="insights" id="stats"></div>
      <div id="provList" class="plist"></div>
    </section>
    <section class="sec" id="s-catalogos" hidden>
      <div class="secHead"><div><h2>Catálogos y listas de precios</h2><p>PDF y enlaces de cada proveedor, siempre a mano para cotizar.</p></div></div>
      <div id="catList" class="cards"></div>
    </section>
    <section class="sec" id="s-movimientos" hidden>
      <div class="toolbar">
        <select id="mProv"><option value="">Todos los proveedores</option></select>
        <select id="mTipo"><option value="">Todos los tipos</option></select>
        <select id="mMes"><option value="">Todos los meses</option></select>
        <button class="btn" id="mExport">⬇ Descargar</button>
      </div>
      <div class="insights" id="mStats"></div>
      <div id="movList"></div>
    </section>
  </main>
</div>

<!-- Ficha de proveedor -->
<div class="sheetWrap" id="sheet" hidden>
  <div class="sheetBg" data-close></div>
  <aside class="sheetCard" role="dialog" aria-modal="true">
    <div class="shHead">
      <button class="iconBtn" data-close title="Cerrar">✕</button>
      <div class="shTitle"><h2 id="pName"></h2><p id="pSub"></p></div>
      <a class="iconBtn wa" id="pWa" target="_blank" rel="noopener" title="WhatsApp">💬</a>
    </div>
    <div class="balCard" id="pBal"></div>
    <div class="quick" id="quick">
      <button data-t="compra_credito"><i>🛒</i>Compra a crédito</button>
      <button data-t="pago_proveedor"><i>💸</i>Registrar pago</button>
      <button data-t="saldar" id="qSaldar"><i>✅</i>Saldar cuenta</button>
      <button data-t="efectivo_cobrado"><i>💵</i>Cobró efectivo</button>
      <button data-t="ajuste"><i>±</i>Ajuste</button>
      <button data-t="estado"><i>📤</i>Enviar estado</button>
    </div>
    <nav class="shTabs" id="pTabs"><button data-t="hist" class="on">Historial</button><button data-t="ped">Pedidos</button><button data-t="cat">Catálogos</button><button data-t="datos">Datos</button></nav>
    <div class="shBody">
      <div class="pane on" data-p="hist"><div id="pHist"></div></div>
      <div class="pane" data-p="ped"><div id="pPed"></div></div>
      <div class="pane" data-p="cat"><div id="pCat"></div></div>
      <div class="pane" data-p="datos">
        <label class="f"><span>Nombre</span><input id="d_nombre" maxlength="80"></label>
        <label class="f"><span>Celular (WhatsApp)</span><input id="d_cel" inputmode="tel" placeholder="57300…"></label>
        <label class="f"><span>Notas</span><textarea id="d_notas" rows="4" placeholder="Condiciones, días de pago, cuenta bancaria…"></textarea></label>
        <button class="btn primary" id="d_save">Guardar datos</button>
        <button class="btn danger ghost" id="d_arch">Archivar proveedor</button>
      </div>
    </div>
  </aside>
</div>

<div class="dlgWrap" id="dlg" hidden><div class="dlgBg"></div><div class="dlg"><h3 id="dlgT"></h3><div id="dlgB"></div><div class="dlgA"><button class="btn" id="dlgNo">Cancelar</button><button class="btn primary" id="dlgOk">Aceptar</button></div></div></div>
<div class="lock" id="lock" hidden><form class="lockBox" id="lockForm"><span class="logo big">💼</span><h2>Proveedores</h2><p>Ingresa la clave de administración</p><input id="lockPw" type="password" autocomplete="current-password" placeholder="Clave"><button class="btn primary">Entrar</button><p class="err" id="lockErr"></p></form></div>
<button class="fab" id="fab" type="button" aria-label="Nuevo proveedor">＋</button>
<div class="toasts" id="toasts"></div>
<input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
<script src="app.js?v=2"></script>
</body>
</html>
