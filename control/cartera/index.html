<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cartera de clientes · SUPGO CONTROL</title>
<link rel="icon" type="image/png" href="/favicon.png?v=supgo-rounded-2">
<link rel="preconnect" href="https://vdxkknftyssjyfbdieqa.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../catalogo/app.css?v=2">
<link rel="stylesheet" href="../proveedores/app.css?v=2">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="topRow">
      <div class="brand"><span class="logo">💰</span><div><h1>Cartera de clientes</h1><p id="sync" class="sync"><i></i><span>Conectando…</span></p></div></div>
      <div class="field grow searchIn"><input id="q" type="search" placeholder="Buscar cliente, celular o pedido…" autocomplete="off"></div>
    </div>
  </header>
  <main>
    <div class="insights" id="stats"></div>
    <div class="chips filt" id="filt"><button data-f="saldo" class="on">Con saldo</button><button data-f="vencidas">Vencidas</button><button data-f="semana">Vencen esta semana</button><button data-f="pagadas">Pagadas</button><button data-f="todas">Todas</button></div>
    <div id="list" class="plist"></div>
  </main>
</div>

<div class="sheetWrap" id="sheet" hidden>
  <div class="sheetBg" data-close></div>
  <aside class="sheetCard" role="dialog" aria-modal="true">
    <div class="shHead">
      <button class="iconBtn" data-close title="Cerrar">✕</button>
      <div class="shTitle"><h2 id="cName"></h2><p id="cSub"></p></div>
      <a class="iconBtn" id="cCall" title="Llamar">📞</a>
    </div>
    <div class="balCard" id="cBal"></div>
    <div class="quick two3" id="quick">
      <button data-a="abono"><i>💵</i>Registrar abono</button>
      <button data-a="cobrar"><i>💬</i>Cobrar por WhatsApp</button>
      <button data-a="todo" id="qTodo"><i>✅</i>Pagó todo</button>
    </div>
    <div class="shBody" id="cDebts"></div>
  </aside>
</div>

<div class="dlgWrap" id="dlg" hidden><div class="dlgBg"></div><div class="dlg"><h3 id="dlgT"></h3><div id="dlgB"></div><div class="dlgA"><button class="btn" id="dlgNo">Cancelar</button><button class="btn primary" id="dlgOk">Aceptar</button></div></div></div>
<div class="lock" id="lock" hidden><form class="lockBox" id="lockForm"><span class="logo big">💰</span><h2>Cartera</h2><p>Ingresa la clave de administración</p><input id="lockPw" type="password" autocomplete="current-password" placeholder="Clave"><button class="btn primary">Entrar</button><p class="err" id="lockErr"></p></form></div>
<div class="toasts" id="toasts"></div>
<script src="app.js?v=1"></script>
</body>
</html>
