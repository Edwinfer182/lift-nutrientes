<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cálculo de ofertas · SUPGO</title><link rel="icon" href="/favicon-48.png"><style>body{margin:0;background:#f3f4f6;color:#111;font:14px Poppins,Arial,sans-serif}main{max-width:700px;margin:8vh auto;padding:24px;background:#fff;border-radius:16px}button{border:0;background:#111;color:#fff;border-radius:10px;padding:13px 20px;cursor:pointer}#status{color:#666;margin-top:12px}</style></head><body><main><h1>Cálculo de ofertas SUPGO</h1><p>Busca productos del catálogo, calcula precios de oferta y prepara el texto para actualizar promociones. Esta herramienta no modifica Supabase automáticamente.</p><button id="launch" disabled>Abrir calculadora</button><p id="status">Cargando herramienta…</p></main><script src="/modulos/calculo-ofertas.js"></script><script>(function(){const btn=document.getElementById('launch'),status=document.getElementById('status');const api=window.SupgoCalculoOfertas;if(!api||typeof api.open!=='function'){status.textContent='No se pudo cargar la calculadora.';return}btn.disabled=false;status.textContent='Herramienta lista.';btn.onclick=()=>api.open();btn.click()})();</script></body></html>
