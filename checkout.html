<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finalizar pedido | SUPGO</title>
<style>html,body{margin:0;height:100%;font-family:Poppins,Arial,sans-serif}iframe{border:0;width:100%;height:100%;display:block}#notice{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#222;z-index:2;padding:20px;text-align:center}#notice[hidden]{display:none}button{padding:12px 20px;border:0;background:#111;color:white;font:inherit;cursor:pointer}</style></head>
<body><div id="notice">Abriendo el formulario de pedido…</div><iframe id="catalog" title="Finalizar pedido SUPGO" src="/"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('catalog'),notice=document.getElementById('notice');
function hasCart(){try{const c=JSON.parse(localStorage.getItem('liftCartV2')||'{}');return Object.values(c).some(v=>Number(typeof v==='object'?(v.quantity??v.qty):v)>0);}catch{return false;}}
function triggerCheckout(){
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)return false;
  const clickCheckout=()=>{
    const candidates=Array.from(doc.querySelectorAll('button,a,[role="button"]'));
    const target=candidates.find(b=>/continuar (pedido|compra)|finalizar (pedido|compra)|ir al checkout/i.test((b.textContent||'').trim())&&b.getClientRects().length);
    if(target){target.click();return true;}
    return false;
  };
  if(typeof win.openOff==='function'){
    try{win.openOff('cart');}catch(e){}
    if(clickCheckout())return true;
    try{win.openOff('checkout');return true;}catch(e){}
  }
  if(clickCheckout())return true;
  return false;
}
frame.addEventListener('load',()=>{
 if(!hasCart()){notice.innerHTML='<div>Tu carrito está vacío. <a href="/">Volver al catálogo</a></div>';return;}
 let attempts=0;
 function open(){attempts++;if(triggerCheckout()){notice.hidden=true;return;}if(attempts<15){setTimeout(open,250);return;}notice.innerHTML='<div><p>No se pudo abrir automáticamente el formulario.</p><button id="retry" type="button">Abrir carrito</button></div>';document.getElementById('retry').onclick=()=>{notice.hidden=true;try{frame.contentWindow.openOff('cart');}catch(e){}};}
 open();
});
})();
</script></body></html>
