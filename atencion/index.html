<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8f9fb"><title>Atención rápida | Lift Nutrientes</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#161c22;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:480px;padding:14px;margin:auto}h1{font-size:17px;margin:3px 0 16px;font-weight:750}label{display:block;font-size:11px;color:#68707a;font-weight:650;margin:10px 0 5px}input,textarea{width:100%;border:1px solid #dfe3e8;border-radius:10px;background:#fff;font:inherit;font-size:14px;outline-color:#248a50;padding:11px}input{height:42px}textarea{resize:vertical;min-height:100px;max-height:24vh}.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.chips button{border:1px solid #e2e6eb;background:white;border-radius:9px;font-size:11px;padding:11px 3px;color:#29323c;font-weight:600}.chips button.active{background:#e3f3e9;border-color:#80b896;color:#137139}.send{border:0;border-radius:11px;background:#159447;color:white;font-weight:750;font-size:15px;width:100%;height:46px;margin-top:10px}.note{font-size:11px;color:#63707b;margin-top:8px}#status{min-height:14px}@media(max-width:400px){main{padding:11px}h1{margin-bottom:11px}.chips{gap:5px;margin:7px 0}.chips button{padding:9px 2px}textarea{min-height:84px;height:95px}}
</style></head><body><main><h1>Atención rápida</h1><label for="name">Nombre</label><input id="name" autocomplete="off" placeholder="Escribe el nombre" autofocus><div id="chips" class="chips"></div><label for="message">Mensaje</label><textarea id="message" rows="4"></textarea><button class="send" id="send" type="button">Enviar por WhatsApp ↗</button><p class="note" id="status" role="status"></p></main><script>
const phrases=[
['Saludo','Hola {nombre}, ¿cómo estás? Te saluda Lift Nutrientes.'],
['Disponible','Hola {nombre}, te confirmo que el producto que consultaste está disponible. ¿Deseas hacer tu pedido?'],
['Seguimiento','Hola {nombre}, quería saber si todavía estás interesado en el producto que consultaste. Estoy pendiente para ayudarte.'],
['Pago','Hola {nombre}, tu pedido está listo para continuar con el pago. ¿Te comparto los datos?'],
['En ruta','Hola {nombre}, tu pedido ya va en ruta. Gracias por tu compra.'],
['Gracias','Hola {nombre}, muchas gracias por comprar con Lift Nutrientes.']
];
const $=id=>document.getElementById(id);let active=0,lastGenerated='';
function firstName(){return $('name').value.trim().split(/\s+/)[0]||''}
function generated(){return phrases[active][1].replaceAll('{nombre}',firstName()).replace(/Hola ,/g,'Hola,')}
function refresh(force=false){const value=generated();if(force||!$('message').value.trim()||$('message').value===lastGenerated){$('message').value=value;}lastGenerated=value;}
$('chips').innerHTML=phrases.map((v,i)=>'<button type="button" data-i="'+i+'" class="'+(i===0?'active':'')+'">'+v[0]+'</button>').join('');
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);document.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('active',x===b));refresh(true);});
$('name').addEventListener('input',()=>refresh(false));refresh(true);
$('send').onclick=async()=>{const message=$('message').value.trim();if(!message){$('status').textContent='Escribe un mensaje.';return;} $('status').textContent='Selecciona WhatsApp y el chat donde quieres enviarlo.';if(navigator.share){try{await navigator.share({text:message});return;}catch(e){if(e.name==='AbortError')return;}}location.href='https://api.whatsapp.com/send?text='+encodeURIComponent(message);};
</script></body></html>
