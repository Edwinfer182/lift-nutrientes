<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8f9fb"><title>Atención rápida</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#171c22;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:480px;padding:12px;margin:auto}h1{font-size:17px;margin:3px 0 8px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 9px}.modes button{border:1px solid #dce2e8;border-radius:9px;background:#fff;padding:8px;font-size:12px;font-weight:700;color:#34414a}.modes button.active{background:#192128;color:#fff;border-color:#192128}input,textarea{width:100%;border:1px solid #dce2e8;border-radius:10px;padding:10px;font:inherit;font-size:16px;outline-color:#208e51;background:white}input{height:42px}textarea{resize:vertical;height:91px;min-height:75px;max-height:150px}.label{display:block;font-size:11px;color:#66727c;font-weight:650;margin:10px 0 5px}.tabs{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;margin:10px -12px 9px;padding:0 12px 4px;overscroll-behavior-x:contain}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;border:1px solid #e0e5ec;background:white;border-radius:20px;padding:8px 11px;color:#34414a;font-size:12px;font-weight:600;white-space:nowrap}.tabs button.active{background:#192128;color:#fff;border-color:#192128}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}.chips button{border:1px solid #e1e6eb;background:white;border-radius:9px;padding:10px 5px;color:#263139;font-size:12px;font-weight:600}.chips button.active{background:#e2f3e9;border-color:#68ad86;color:#086f39}.pages{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}.pages button{border:0;background:#eef1f4;color:#34404a;border-radius:8px;padding:7px 9px;font-size:11px}.pages span{font-size:11px;color:#6a7480}.identity{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-top:8px}.copy{height:45px;border:1px solid #dbe1e7;background:white;border-radius:10px;font-weight:650;color:#263139;font-size:13px}.send{background:#159447;border:0;border-radius:10px;color:white;font-size:15px;font-weight:700;width:100%;height:45px;margin-top:0}.note{font-size:11px;color:#6b7580;margin-top:6px;min-height:15px}@media(max-height:650px){main{padding-top:7px}h1{margin-bottom:6px}.tabs{margin-top:7px;margin-bottom:5px}.chips button{padding:7px 4px}textarea{height:76px}}
</style></head><body><main><h1>Atención rápida</h1><div class="modes" id="modes"><button class="active" type="button" data-mode="regular">Regulares</button><button type="button" data-mode="formal">Formales</button></div><div class="identity"><input id="name" placeholder="Nombre" aria-label="Nombre" autocomplete="off"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Celular" aria-label="Celular"></div><nav id="tabs" class="tabs" aria-label="Momentos de venta"></nav><div id="chips" class="chips"></div><div class="pages"><button id="prev" type="button">‹ Anteriores</button><span id="pageCount"></span><button id="next" type="button">Más respuestas ›</button></div><textarea id="message" aria-label="Mensaje" rows="3"></textarea><div class="actions"><button id="copy" class="copy" type="button">Copiar</button><button id="send" class="send" type="button">WhatsApp ↗</button></div><p id="status" class="note" role="status"></p></main><script>
const categories={"Saludar":[["Natural","Hola {nombre}, cómo vas"],["Buenos días","Buenos días, {nombre}. Cómo amaneciste"],["Buenas tardes","Hola {nombre}, buenas tardes. Cómo va todo"],["Buenas noches","Hola {nombre}, buenas noches. Cómo te fue hoy"]],"Consulta":[["¿Qué buscas?","Cuéntame, {nombre}, qué producto estás buscando"],["Objetivo","{nombre}, qué objetivo tienes en mente Así te recomiendo algo que te sirva."],["Presentación","{nombre}, qué presentación o tamaño prefieres"],["Te asesoro","Claro, {nombre}. Cuéntame qué necesitas y te ayudo a elegir."]],"Precio":[["Te cotizo","{nombre}, ya te reviso el precio y te cuento"],["Presupuesto","{nombre}, qué presupuesto tienes pensado Así buscamos la mejor opción."],["Alternativa","{nombre}, también tengo otra opción que puede ajustarse mejor a tu presupuesto."],["Promo","{nombre}, te cuento que este producto tiene una promoción disponible."]],"Disponible":[["Sí hay","{nombre}, sí lo tengo disponible Te lo separo"],["Confirmando","{nombre}, déjame confirmar disponibilidad y te aviso."],["Agotado","{nombre}, por ahora está agotado. Te muestro una alternativa"],["Sabores","{nombre}, qué sabor prefieres Te confirmo cuáles hay."]],"Cierre":[["¿Lo llevas?","{nombre}, te lo dejamos listo para despacho"],["Separar","{nombre}, quieres que te lo separe"],["Datos","{nombre}, pásame por favor nombre, dirección y barrio para organizar tu pedido."],["Último paso","{nombre}, ya tenemos todo listo. Confirmamos el pedido"]],"Pago":[["Datos pago","{nombre}, ya está listo. Te comparto los datos para pagar"],["Confirmación","{nombre}, apenas hagas el pago me envías el comprobante y seguimos con tu pedido."],["Recibido","{nombre}, pago recibido, muchas gracias"],["Pendiente","{nombre}, pudiste realizar el pago Quedo pendiente."]],"Entrega":[["Hoy","{nombre}, estamos organizando la ruta de hoy. Te aviso cuando salga."],["En ruta","{nombre}, tu pedido ya va en camino"],["Sin hora","{nombre}, el mensajero lleva varios pedidos en ruta, por eso no tengo una hora exacta."],["Guía","{nombre}, ya tengo la guía de tu envío. Te la comparto enseguida."]],"Seguimiento":[["¿Aún interesa?","Hola {nombre}, cómo vas Quería saber si todavía te interesa lo que hablamos"],["Cotización","{nombre}, pudiste revisar la cotización que te envié"],["¿Dudas?","{nombre}, te quedó alguna duda Estoy pendiente para ayudarte."],["Retomar","Hola {nombre}, cómo te ha ido Retomamos lo que estábamos viendo"]],"Postventa":[["¿Llegó?","{nombre}, te llegó bien el pedido"],["¿Qué tal?","{nombre}, qué tal te ha parecido el producto"],["Gracias","Gracias por la confianza, {nombre}. Que lo disfrutes mucho"],["Recompra","Hola {nombre}, cómo vas Necesitas reponer algo de lo que llevaste"]],"Charla":[["Qué cuentas","Qué más {nombre}, qué me cuentas"],["Cómo te ha ido","{nombre}, cómo te ha ido estos días"],["Todo bien","Me alegra saber que todo va bien {nombre}"],["Aquí andamos","Por acá todo bien {nombre}, trabajando bastante"],["Qué has hecho","{nombre}, qué has hecho de bueno"],["Tiempo sin hablar","{nombre}, hace rato no hablamos. Cómo has estado"],["Te entiendo","Claro {nombre}, te entiendo perfectamente"],["Qué bueno","Qué bueno saber eso {nombre}"]],"Vida diaria":[["Familia","{nombre}, cómo sigue la familia"],["Trabajo","{nombre}, cómo te ha ido con el trabajo"],["Fin de semana","{nombre}, cómo estuvo tu fin de semana"],["Mucho trabajo","Uf {nombre}, me imagino cómo has estado de ocupado"],["Descanso","{nombre}, has podido descansar algo"],["Planes","{nombre}, qué planes tienes para estos días"],["Me alegra","Me alegra mucho escuchar eso {nombre}"],["Cuídate","Bueno {nombre}, cuídate mucho y seguimos hablando"]],"Gym":[["Cómo va el gym","{nombre}, cómo vas con el gym"],["Entrenaste","{nombre}, hoy sí alcanzaste a entrenar"],["Rutina","{nombre}, qué has estado entrenando estos días"],["Progreso","{nombre}, cómo te has sentido con los entrenamientos"],["Disciplina","Eso es lo importante {nombre}, seguir constante"],["Descanso gym","También toca descansar {nombre}, no todo es darle duro"],["Volviendo","Lo importante es retomar a tu ritmo {nombre}"],["Qué tal energía","{nombre}, cómo has estado de energía para entrenar"]],"Ánimo":[["Día pesado","Uy {nombre}, suena a que fue un día pesado"],["Te escucho","Te leo {nombre}, cuéntame"],["Desaliento","Te entiendo {nombre}, hay días en que cuesta arrancar"],["Sin afán","Tranquilo {nombre}, ve a tu ritmo"],["Qué bueno","Me alegra mucho por ti {nombre}"],["Ojalá mejore","Ojalá las cosas mejoren pronto {nombre}"],["Mucho ánimo","Mucho ánimo {nombre}, espero que todo salga bien"],["Aquí estoy","Aquí estoy pendiente {nombre}"]],"Retomar charla":[["En qué íbamos","{nombre}, en qué habíamos quedado"],["Me acordé","{nombre}, me acordé de lo que me contaste"],["Cómo siguió","{nombre}, cómo siguió eso que me habías contado"],["Todo resuelto","{nombre}, al final pudiste resolver eso"],["Qué pasó","{nombre}, y al final qué pasó"],["Luego hablamos","Bueno {nombre}, hablamos luego con calma"],["Pendiente","Sigo pendiente {nombre}"],["Gracias por contar","Gracias por contarme {nombre}, de verdad"]]};
const formalCategories={"Saludar":[["Buenos días","Buenos días, {nombre}. Espero que se encuentre muy bien"],["Buenas tardes","Buenas tardes, {nombre}. Un gusto saludarle"],["Buenas noches","Buenas noches, {nombre}. Espero que haya tenido un buen día"],["Primer contacto","Cordial saludo, {nombre}. Con gusto le atiendo"]],"Consulta":[["En qué ayudar","{nombre}, cuénteme en qué puedo ayudarle"],["Producto","{nombre}, ¿qué producto está buscando?"],["Información","Con mucho gusto, {nombre}. Le comparto la información que necesita"],["Orientación","{nombre}, puedo orientarle sobre las opciones disponibles"]],"Precio":[["Cotización","{nombre}, con gusto le preparo la cotización"],["Verificación","Permítame confirmar el precio actualizado y enseguida le informo"],["Alternativas","{nombre}, también contamos con otras opciones que podrían ajustarse a su presupuesto"],["Promoción","{nombre}, actualmente tenemos una promoción que podría interesarle"]],"Disponibilidad":[["Confirmada","{nombre}, le confirmo que el producto está disponible"],["Verificando","{nombre}, estoy verificando disponibilidad. En cuanto tenga confirmación le aviso"],["Agotado","{nombre}, por el momento no contamos con existencias. Puedo ofrecerle otra alternativa"],["Presentación","{nombre}, ¿qué presentación o tamaño necesita?"]],"Pedido":[["Confirmar","{nombre}, ¿desea que procedamos con su pedido?"],["Datos","Para gestionar su pedido, por favor compártame su nombre, dirección y barrio"],["Preparación","{nombre}, estamos coordinando la preparación de su pedido"],["Resumen","{nombre}, le comparto el resumen de su pedido para que pueda revisarlo"]],"Pago":[["Medios de pago","{nombre}, con gusto le comparto los medios de pago disponibles"],["Comprobante","Cuando realice el pago, por favor envíeme el comprobante para continuar con su pedido"],["Validación","{nombre}, estamos validando su pago. Le confirmo en cuanto se registre"],["Confirmado","{nombre}, su pago ha sido confirmado. Muchas gracias"]],"Entrega":[["Programación","{nombre}, estamos coordinando el despacho de su pedido"],["En camino","{nombre}, le informo que su pedido ya se encuentra en ruta"],["Horario","La ruta comprende varias entregas, por lo que no contamos con una hora exacta de llegada"],["Guía","{nombre}, le comparto la guía de seguimiento de su envío"]],"Seguimiento":[["Cotización","Buenos días, {nombre}. Quisiera saber si pudo revisar la cotización enviada"],["Inquietudes","{nombre}, quedo atento a cualquier inquietud que tenga"],["Continuar","{nombre}, quisiera confirmar si desea continuar con el proceso"],["Sin presión","{nombre}, cuando le resulte conveniente podemos retomar la conversación"]],"Postventa":[["Recepción","{nombre}, ¿recibió su pedido en buenas condiciones?"],["Experiencia","{nombre}, quisiera saber cómo le ha parecido el producto"],["Agradecimiento","{nombre}, muchas gracias por su compra y por la confianza depositada"],["Nueva compra","{nombre}, será un gusto atenderle nuevamente cuando lo necesite"]],"Cortesía":[["Cómo se encuentra","{nombre}, espero que se encuentre muy bien"],["Agradecer respuesta","Muchas gracias por su respuesta, {nombre}"],["Comprensión","Comprendo la situación, {nombre}. Gracias por comentármela"],["Buenos deseos","{nombre}, le deseo un excelente resto de día"]],"Situaciones":[["Demora","{nombre}, le ofrezco disculpas por la demora. Estoy revisando su caso"],["Inconveniente","{nombre}, lamento el inconveniente. Permítame revisar cómo podemos solucionarlo"],["Esperar respuesta","{nombre}, gracias por su paciencia. Le informaré tan pronto tenga novedades"],["No disponible","{nombre}, en este momento no es posible confirmarlo. Prefiero verificar antes de darle una respuesta"]]};const regularCategories=categories;const $=id=>document.getElementById(id);let mode="regular";let category=Object.keys(categories)[0],active=0,lastGenerated='',page=0;
function source(){return mode==='formal'?formalCategories:regularCategories;}function firstName(){return $('name').value.trim().split(/\s+/)[0]||'';}
function generated(){const n=firstName();return source()[category][active][1].replaceAll('{nombre}',n).replace(/Hola ,/g,'Hola,').replace(/Buenos días, \./g,'Buenos días.');}
function refresh(force=false){const next=generated();if(force||!$('message').value.trim()||$('message').value===lastGenerated)$('message').value=next;lastGenerated=next;}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);});const keys=Object.keys(source());$('tabs').innerHTML=keys.map(x=>'<button type="button" class="'+(x===category?'active':'')+'" data-cat="'+x+'">'+x+'</button>').join('');$('chips').innerHTML=source()[category].slice(page*4,page*4+4).map((p,i)=>'<button type="button" class="'+(active===page*4+i?'active':'')+'" data-i="'+(page*4+i)+'">'+p[0]+'</button>').join('');$('pageCount').textContent=(page+1)+' / '+Math.ceil(source()[category].length/4);$('prev').disabled=page===0;$('next').disabled=(page+1)*4>=source()[category].length;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;active=0;page=0;render();refresh(true);});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);render();refresh(true);});}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;category=Object.keys(source())[0];active=0;page=0;render();refresh(true);});$('prev').onclick=()=>{page=Math.max(0,page-1);active=page*4;render();refresh(true)};$('next').onclick=()=>{page=Math.min(Math.ceil(source()[category].length/4)-1,page+1);active=page*4;render();refresh(true)};
$('name').addEventListener('input',()=>refresh());render();refresh(true);
$('copy').onclick=async()=>{const message=$('message').value.trim();if(!message){$('status').textContent='Escribe el mensaje';return;}try{await navigator.clipboard.writeText(message);$('status').textContent='Mensaje copiado';}catch(e){$('message').focus();$('message').select();$('status').textContent='Selecciona Copiar en tu teléfono';}};
$('send').onclick=()=>{const message=$('message').value.trim();const digits=$('phone').value.replace(/\D/g,'');if(!message){$('status').textContent='Escribe el mensaje';return;}if(digits.length<10||digits.length>15){$('status').textContent='Ingresa un celular válido';return;}const phone=digits.length===10?'57'+digits:digits;$('status').textContent='Abriendo WhatsApp';location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);};
</script></body></html>
