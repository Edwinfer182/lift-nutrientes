const regularCategories=categories;const $=id=>document.getElementById(id);let mode="regular";let category=Object.keys(categories)[0],active=0,lastGenerated='',page=0;
function source(){return mode==='formal'?formalCategories:mode==='provider'?providerCategories:regularCategories;}function firstName(){return $('name').value.trim().split(/\s+/)[0]||'';}
function generated(){const n=firstName();return source()[category][active][1].replaceAll('{nombre}',n).replace(/Hola ,/g,'Hola,').replace(/Buenos días, \./g,'Buenos días.');}
function refresh(force=false){const next=generated();if(force||!$('message').value.trim()||$('message').value===lastGenerated)$('message').value=next;lastGenerated=next;}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);});const keys=Object.keys(source());$('tabs').innerHTML=keys.map(x=>'<button type="button" class="'+(x===category?'active':'')+'" data-cat="'+x+'">'+x+'</button>').join('');$('chips').innerHTML=source()[category].slice(page*8,page*8+8).map((p,i)=>'<button type="button" class="'+(active===page*8+i?'active':'')+'" data-i="'+(page*8+i)+'">'+p[0]+'</button>').join('');$('pageCount').textContent=(page+1)+' / '+Math.ceil(source()[category].length/8)+' · '+source()[category].length+' respuestas';$('prev').disabled=page===0;$('next').disabled=(page+1)*8>=source()[category].length;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;active=0;page=0;render();refresh(true);});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);render();refresh(true);});}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;category=Object.keys(source())[0];active=0;page=0;render();refresh(true);});$('prev').onclick=()=>{page=Math.max(0,page-1);active=page*8;render();refresh(true)};$('next').onclick=()=>{page=Math.min(Math.ceil(source()[category].length/8)-1,page+1);active=page*8;render();refresh(true)};
$('name').addEventListener('input',()=>refresh());render();refresh(true);
$('copy').onclick=async()=>{const message=$('message').value.trim();if(!message){$('status').textContent='Escribe el mensaje';return;}try{await navigator.clipboard.writeText(message);$('status').textContent='Mensaje copiado';}catch(e){$('message').focus();$('message').select();$('status').textContent='Selecciona Copiar en tu teléfono';}};
$('send').onclick=()=>{const message=$('message').value.trim();const digits=$('phone').value.replace(/\D/g,'');if(!message){$('status').textContent='Escribe el mensaje';return;}if(digits.length<10||digits.length>15){$('status').textContent='Ingresa un celular válido';return;}const phone=digits.length===10?'57'+digits:digits;$('status').textContent='Abriendo WhatsApp';location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);};
