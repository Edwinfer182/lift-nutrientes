<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8f9fb"><title>Atención rápida</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#171c22;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:480px;padding:12px;margin:auto}h1{font-size:17px;margin:3px 0 12px}input,textarea{width:100%;border:1px solid #dce2e8;border-radius:10px;padding:10px;font:inherit;font-size:16px;outline-color:#208e51;background:white}input{height:42px}textarea{resize:vertical;height:91px;min-height:75px;max-height:150px}.label{display:block;font-size:11px;color:#66727c;font-weight:650;margin:10px 0 5px}.tabs{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;margin:10px -12px 9px;padding:0 12px 4px;overscroll-behavior-x:contain}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;border:1px solid #e0e5ec;background:white;border-radius:20px;padding:8px 11px;color:#34414a;font-size:12px;font-weight:600;white-space:nowrap}.tabs button.active{background:#192128;color:#fff;border-color:#192128}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}.chips button{border:1px solid #e1e6eb;background:white;border-radius:9px;padding:10px 5px;color:#263139;font-size:12px;font-weight:600}.chips button.active{background:#e2f3e9;border-color:#68ad86;color:#086f39}.send{background:#159447;border:0;border-radius:10px;color:white;font-size:15px;font-weight:700;width:100%;height:45px;margin-top:8px}.note{font-size:11px;color:#6b7580;margin-top:6px;min-height:15px}@media(max-height:650px){main{padding-top:7px}h1{margin-bottom:6px}.tabs{margin-top:7px;margin-bottom:5px}.chips button{padding:7px 4px}textarea{height:76px}}
</style></head><body><main><h1>Atención rápida</h1><input id="name" placeholder="Nombre" aria-label="Nombre" autocomplete="off"><nav id="tabs" class="tabs" aria-label="Momentos de venta"></nav><div id="chips" class="chips"></div><textarea id="message" aria-label="Mensaje" rows="3"></textarea><button id="send" class="send">WhatsApp ↗</button><p id="status" class="note" role="status"></p></main><script>
const categories={"Saludar":[["Natural","Hola {nombre}, ¿cómo vas? 😊"],["Buenos días","Buenos días, {nombre}. ¿Cómo amaneciste?"],["Buenas tardes","Hola {nombre}, buenas tardes. ¿Cómo va todo?"],["Buenas noches","Hola {nombre}, buenas noches. ¿Cómo te fue hoy?"]],"Consulta":[["¿Qué buscas?","Cuéntame, {nombre}, ¿qué producto estás buscando?"],["Objetivo","{nombre}, ¿qué objetivo tienes en mente? Así te recomiendo algo que te sirva."],["Presentación","{nombre}, ¿qué presentación o tamaño prefieres?"],["Te asesoro","Claro, {nombre}. Cuéntame qué necesitas y te ayudo a elegir."]],"Precio":[["Te cotizo","{nombre}, ya te reviso el precio y te cuento 😊"],["Presupuesto","{nombre}, ¿qué presupuesto tienes pensado? Así buscamos la mejor opción."],["Alternativa","{nombre}, también tengo otra opción que puede ajustarse mejor a tu presupuesto."],["Promo","{nombre}, te cuento que este producto tiene una promoción disponible."]],"Disponible":[["Sí hay","{nombre}, sí lo tengo disponible 🙌 ¿Te lo separo?"],["Confirmando","{nombre}, déjame confirmar disponibilidad y te aviso."],["Agotado","{nombre}, por ahora está agotado. ¿Te muestro una alternativa?"],["Sabores","{nombre}, ¿qué sabor prefieres? Te confirmo cuáles hay."]],"Cierre":[["¿Lo llevas?","{nombre}, ¿te lo dejamos listo para despacho?"],["Separar","{nombre}, ¿quieres que te lo separe?"],["Datos","{nombre}, pásame por favor nombre, dirección y barrio para organizar tu pedido."],["Último paso","{nombre}, ya tenemos todo listo. ¿Confirmamos el pedido?"]],"Pago":[["Datos pago","{nombre}, ya está listo. ¿Te comparto los datos para pagar?"],["Confirmación","{nombre}, apenas hagas el pago me envías el comprobante y seguimos con tu pedido."],["Recibido","{nombre}, pago recibido, muchas gracias 🙌"],["Pendiente","{nombre}, ¿pudiste realizar el pago? Quedo pendiente."]],"Entrega":[["Hoy","{nombre}, estamos organizando la ruta de hoy. Te aviso cuando salga."],["En ruta","{nombre}, tu pedido ya va en camino 🙌"],["Sin hora","{nombre}, el mensajero lleva varios pedidos en ruta, por eso no tengo una hora exacta."],["Guía","{nombre}, ya tengo la guía de tu envío. Te la comparto enseguida."]],"Seguimiento":[["¿Aún interesa?","Hola {nombre}, ¿cómo vas? Quería saber si todavía te interesa lo que hablamos 😊"],["Cotización","{nombre}, ¿pudiste revisar la cotización que te envié?"],["¿Dudas?","{nombre}, ¿te quedó alguna duda? Estoy pendiente para ayudarte."],["Retomar","Hola {nombre}, ¿cómo te ha ido? ¿Retomamos lo que estábamos viendo?"]],"Postventa":[["¿Llegó?","{nombre}, ¿te llegó bien el pedido? 😊"],["¿Qué tal?","{nombre}, ¿qué tal te ha parecido el producto?"],["Gracias","Gracias por la confianza, {nombre}. ¡Que lo disfrutes mucho! 🙌"],["Recompra","Hola {nombre}, ¿cómo vas? ¿Necesitas reponer algo de lo que llevaste?"]]};
const $=id=>document.getElementById(id);let category=Object.keys(categories)[0],active=0,lastGenerated='';
function firstName(){return $('name').value.trim().split(/\s+/)[0]||'';}
function generated(){const n=firstName();return categories[category][active][1].replaceAll('{nombre}',n).replace(/Hola ,/g,'Hola,').replace(/Buenos días, \./g,'Buenos días.');}
function refresh(force=false){const next=generated();if(force||!$('message').value.trim()||$('message').value===lastGenerated)$('message').value=next;lastGenerated=next;}
function render(){const keys=Object.keys(categories);$('tabs').innerHTML=keys.map(x=>'<button type="button" class="'+(x===category?'active':'')+'" data-cat="'+x+'">'+x+'</button>').join('');$('chips').innerHTML=categories[category].map((p,i)=>'<button type="button" class="'+(active===i?'active':'')+'" data-i="'+i+'">'+p[0]+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;active=0;render();refresh(true);});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);render();refresh(true);});}
$('name').addEventListener('input',()=>refresh());render();refresh(true);
$('send').onclick=async()=>{const message=$('message').value.trim();if(!message){$('status').textContent='Escribe el mensaje.';return;}$('status').textContent='Selecciona el chat en WhatsApp.';if(navigator.share){try{await navigator.share({text:message});return;}catch(e){if(e.name==='AbortError')return;}}location.href='https://api.whatsapp.com/send?text='+encodeURIComponent(message);};
</script></body></html>
