<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de ofertas | SUPGO</title><style>body{font:14px Inter,Arial,sans-serif;background:#f6f8fb;color:#182434;margin:0;padding:24px}main{max-width:1500px;margin:auto}h1{font-size:23px;margin:0 0 8px}.muted{color:#64748b}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}input,button{font:inherit;box-sizing:border-box;border:1px solid #d5deea;border-radius:8px;padding:10px;width:100%;background:white}input[readonly]{background:#edf2f7;color:#374151}input[type=date]{width:200px}button{background:#b3ff60;cursor:pointer;font-weight:600;width:auto;border:0}table{border-collapse:separate;border-spacing:0 9px;width:100%;min-width:1120px}th{text-align:left;font-size:12px;color:#475569;padding:8px}td{padding:7px;vertical-align:top;background:white;border-top:1px solid #e5eaf0;border-bottom:1px solid #e5eaf0}td:first-child{border-left:1px solid #e5eaf0;border-radius:9px 0 0 9px}td:last-child{border-right:1px solid #e5eaf0;border-radius:0 9px 9px 0}.wrap{overflow-x:auto}.search{position:relative}.results{position:absolute;top:100%;left:0;right:0;z-index:10;background:white;box-shadow:0 8px 25px #0002;max-height:190px;overflow:auto}.results button{display:block;width:100%;background:white;text-align:left;font-weight:400;border-radius:0;border-bottom:1px solid #eee}.results button:hover{background:#eff8e8}.note{font-size:12px;margin-top:5px}.id{font-size:11px;color:#64748b;padding-top:5px}.final{font-weight:700;color:#18744a;white-space:nowrap;padding:12px}.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}#status{font-size:12px;color:#64748b}#preview{white-space:pre-wrap;background:#111827;color:#f8fafc;padding:15px;border-radius:8px;max-height:350px;overflow:auto}</style></head><body><main><header><div><h1>Gestor de ofertas SUPGO</h1><div class="muted">10 promociones · Precio normal automático desde Supabase · Simulador sin cambios en la base</div></div><div><label for="expiry">Vencimiento del lote</label><br><input type="date" id="expiry" value="2026-11-01"></div></header><div class="wrap"><table><thead><tr><th>Producto / ID</th><th>Precio normal</th><th>Mayorista</th><th>Ganancia (+)</th><th>Precio final (=)</th><th>Regalo / ID</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="copy">Copiar prompt para Supabase</button><button id="show">Ver prompt</button><span id="status"></span></div><pre id="preview" hidden></pre></main><script>
const URL='https://vdxkknftyssjyfbdieqa.supabase.co', KEY='sb_publishable_ECuhXuKIb85kj9fgdEjrAw_O7uNpZsh';
let catalog=[], rows=Array.from({length:10},()=>({product:null,gift:null,wholesale:'',gain:'',notes:'',giftNotes:''}));
const fmt=n=>'$ '+Number(n).toLocaleString('es-CO'),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const body=document.getElementById('rows'),status=document.getElementById('status');
function build(){body.innerHTML='';rows.forEach((r,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td><div class="search"><input data-k="product" placeholder="'+(i+1)+'. Buscar producto" autocomplete="off"><div class="results" hidden></div></div><div class="id" data-id="product">ID: sin seleccionar</div><input class="note" data-k="notes" placeholder="Notas: sabores..."></td><td><input data-k="normal" value="Selecciona producto" readonly></td><td><input type="number" min="0" data-k="wholesale" placeholder="$ 0"></td><td><input type="number" min="0" data-k="gain" placeholder="+ $ 0"></td><td><div class="final" data-final>Pendiente</div></td><td><div class="search"><input data-k="gift" placeholder="Buscar regalo" autocomplete="off"><div class="results" hidden></div></div><div class="id" data-id="gift">ID: sin regalo</div><input class="note" data-k="giftNotes" placeholder="Notas: sabor..."></td>';body.append(tr);tr.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{let k=el.dataset.k;if(k==='product'||k==='gift'){r[k]=null;tr.querySelector('[data-id="'+k+'"]').textContent='ID: sin seleccionar';if(k==='product')tr.querySelector('[data-k="normal"]').value='Selecciona producto';suggest(tr,i,k,el.value)}else r[k]=el.value;calculate(tr,r)}))})}
function suggest(tr,i,k,q){let input=tr.querySelector('[data-k="'+k+'"]'),list=input.nextElementSibling;list.innerHTML='';if(!q.trim()){list.hidden=true;return}let found=catalog.filter(p=>norm(p.name+' '+p.brand).includes(norm(q))).slice(0,7);found.forEach(p=>{let b=document.createElement('button');b.type='button';b.textContent=p.name+' · '+p.brand+' · ID '+p.id;b.addEventListener('click',()=>{rows[i][k]=p;input.value=p.name;tr.querySelector('[data-id="'+k+'"]').textContent='ID: '+p.id;if(k==='product')tr.querySelector('[data-k="normal"]').value=fmt(p.price);list.hidden=true;calculate(tr,rows[i])});list.append(b)});list.hidden=!found.length}
function calculate(tr,r){let n=r.wholesale!==''&&r.gain!==''?Number(r.wholesale)+Number(r.gain):null;tr.querySelector('[data-final]').textContent=n===null?'Pendiente':fmt(n)}
async function load(){status.textContent='Cargando productos y precios reales...';try{let offset=0;while(true){let res=await fetch(URL+'/rest/v1/lift_productos?select=id,product,activo&limit=500&offset='+offset,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!res.ok)throw Error('Supabase HTTP '+res.status);let data=await res.json();catalog.push(...data.filter(x=>x.activo!==false&&!x.product?.__deleted&&!x.product?.__private&&!x.product?.hidden&&!x.product?.oculto).map(x=>({id:x.id,name:x.product?.name||'',brand:x.product?.brand||'',price:Number(x.product?.price||0)})).filter(x=>x.name));if(data.length<500)break;offset+=500}status.textContent=catalog.length+' productos disponibles; precio normal obtenido del catálogo.'}catch(e){status.textContent='No se pudo cargar el catálogo: '+e.message}}
function prompt(){let chosen=rows.filter(r=>r.product&&r.wholesale!==''&&r.gain!==''&&(!r.giftNotes||r.gift));return 'Actualiza exclusivamente estas ofertas en el Supabase existente de SUPGO. Localiza cada producto por su ID real, conserva el precio normal y configura el regalo opcional por ID. Fecha de vencimiento: '+document.getElementById('expiry').value+' (America/Bogota). Verifica los registros antes y después.\n\n'+chosen.map(r=>'Producto: '+r.product.name+'\nID producto: '+r.product.id+'\nRegalo: '+(r.gift?.name||'Ninguno')+'\nID regalo: '+(r.gift?.id??'Ninguno')+'\nPrecio de oferta: '+(Number(r.wholesale)+Number(r.gain))).join('\n\n')}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(prompt());status.textContent='Prompt copiado'}catch{status.textContent='Copia desde la vista previa'}};document.getElementById('show').onclick=()=>{let p=document.getElementById('preview');p.hidden=!p.hidden;p.textContent=prompt()};build();load();</script></body></html>
