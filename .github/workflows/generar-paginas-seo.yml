name: Generar páginas SEO de productos
on:
  push:
    paths:
      - '.github/workflows/generar-paginas-seo.yml'
      - 'scripts/generar_paginas_seo.py'
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca a generar (vacío = todas las habilitadas)"
        type: string
        default: ""
      regenerar_existentes:
        description: "Sobrescribir fichas existentes con la nueva plantilla (solo ejecución manual)"
        type: boolean
        default: false
      solo_creatina_iron:
        description: "Generar solo Creatina Iron (ID 102) para validar"
        type: boolean
        default: false
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-productos
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas desde Supabase
        env:
          SUPABASE_URL: https://vdxkknftyssjyfbdieqa.supabase.co
          SEO_OVERWRITE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerar_existentes && '1' || '0' }}
          SEO_PREVIEW_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_creatina_iron && '102' || '' }}
          SEO_BRAND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.marca || '' }}
        run: python scripts/generar_paginas_seo.py
      - name: Publicar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/ productos-assets/ sitemap-productos.xml
          if ! git diff --cached --quiet; then
            git commit -m "SEO: actualizar fichas individuales desde Supabase"
            git pull --rebase origin main
            git push
          fi

# Regenerar todas las marcas con Open Graph al inicio del head (2026-10-16).
