name: Generar páginas SEO de productos
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-productos
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas desde Supabase
        env:
          SUPABASE_URL: https://vdxkknftyssjyfbdieqa.supabase.co
        run: python scripts/generar_paginas_seo.py
      - name: Publicar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/ sitemap-productos.xml producto-vista.html
          if ! git diff --cached --quiet; then
            git commit -m "SEO: actualizar fichas individuales desde Supabase"
            git push
          fi
