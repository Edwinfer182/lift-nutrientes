name: Generar páginas SEO de productos
on:
  push:
    paths:
      - '.github/workflows/generar-paginas-seo.yml'
      - 'scripts/generar_paginas_seo.py'
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca a generar (vacío = todas las habilitadas)"
        type: string
        default: ""
      solo_creatina_iron:
        description: "Generar solo Creatina Iron (ID 102) para validar"
        type: boolean
        default: false
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-productos
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis del generador
        run: python -m py_compile scripts/generar_paginas_seo.py
      - name: Generar páginas desde Supabase
        env:
          SUPABASE_URL: https://vdxkknftyssjyfbdieqa.supabase.co
          SEO_OVERWRITE_EXISTING: '1'
          SEO_PREVIEW_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_creatina_iron && '102' || '' }}
          SEO_BRAND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.marca || '' }}
        run: python scripts/generar_paginas_seo.py
      - name: Verificar HTML SEO y Schema del producto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          page = Path("productos/100-gold-isolate-standard-5-lb-30188.html")
          assert page.exists(), "Falta la ficha Gold Isolate 30188"
          html = page.read_text(encoding="utf-8")
          assert '<meta name="description"' in html, "Falta metadescripción"
          assert re.search(r'<main(?:\\s|>)', html) and '<h1>' in html, "Falta ficha SEO visible"
          assert '<meta name="description"' in html, "Falta descripción del producto"
          blocks = re.findall(r'<script type="application/ld[+]json">(.*?)</script>', html, re.S)
          schemas = [json.loads(block) for block in blocks]
          assert any(s.get("@type") == "Product" and s.get("offers", {}).get("price") for s in schemas), "Falta Product/Offer JSON-LD"
          assert any(s.get("@type") == "BreadcrumbList" for s in schemas), "Falta BreadcrumbList JSON-LD"
          print("SEO verificado: descripción larga, metadescripción, Product/Offer y BreadcrumbList")
          PY
      - name: Publicar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/ productos-assets/ sitemap-productos.xml
          if ! git diff --cached --quiet; then
            git commit -m "SEO: actualizar fichas individuales desde Supabase"
            git pull --rebase origin main
            git push
          fi

# Regenerar todas las marcas con Open Graph al inicio del head (2026-10-16).
