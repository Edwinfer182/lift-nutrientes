name: Generar páginas SEO de productos
on:
  push:
    paths:
      - '.github/workflows/generar-paginas-seo.yml'
      - 'scripts/generar_paginas_seo.py'
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca a generar (vacío = todas las habilitadas)"
        type: string
        default: ""
      solo_creatina_iron:
        description: "Generar solo Creatina Iron (ID 102) para validar"
        type: boolean
        default: false
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-productos
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis del generador
        run: python -m py_compile scripts/generar_paginas_seo.py
      - name: Generar páginas desde Supabase
        env:
          SUPABASE_URL: https://vdxkknftyssjyfbdieqa.supabase.co
          SEO_OVERWRITE_EXISTING: '1'
          SEO_PREVIEW_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_creatina_iron && '102' || '' }}
          SEO_BRAND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.marca || '' }}
        run: python scripts/generar_paginas_seo.py
      - name: Garantizar WhatsApp en fichas HTML existentes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          updated=0
          for page in Path("productos").glob("*.html"):
              html=page.read_text(encoding="utf-8",errors="replace")
              if 'class="product-info"' not in html or 'id="seo-wa-button"' in html:
                  continue
              marker='<div class="product-rule"></div>'
              if marker not in html:
                  continue
              block='''<div class="seo-wa-wrap" style="margin:14px 0">
              <button id="seo-wa-button" type="button" aria-expanded="false" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;background:white;color:#222;font:600 14px Poppins,Arial,sans-serif">Consultar por WhatsApp</button>
              <div id="seo-wa-panel" hidden style="padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:8px">
              <textarea id="seo-wa-message" style="box-sizing:border-box;width:100%;min-height:75px;padding:12px;border:1px solid #ddd;border-radius:8px;font:14px Poppins,Arial,sans-serif"></textarea>
              <button id="seo-wa-send" type="button" style="width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#169c50;color:white;font:600 14px Poppins,Arial,sans-serif">Enviar por WhatsApp</button></div></div>
              <script>(function(){const b=document.getElementById('seo-wa-button'),p=document.getElementById('seo-wa-panel'),t=document.getElementById('seo-wa-message'),s=document.getElementById('seo-wa-send');if(!b||!p||!t||!s)return;const n=document.querySelector('.product-info h1')?.childNodes[0]?.textContent?.trim()||'este producto';t.value='Hola, estoy interesado en '+n+'. ¿Está disponible?';b.onclick=()=>{p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))};s.onclick=()=>{location.href='https://api.whatsapp.com/send?text='+encodeURIComponent(t.value+'\\n'+location.href)}})();</script>'''
              html=html.replace(marker,block+marker,1)
              page.write_text(html,encoding="utf-8")
              updated+=1
          print("Fichas HTML reparadas:",updated)
          PY
      - name: Verificar HTML SEO y Schema del producto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          page = Path("productos/100-gold-isolate-standard-5-lb-30188.html")
          assert page.exists(), "Falta la ficha Gold Isolate 30188"
          html = page.read_text(encoding="utf-8")
          assert '<meta name="description"' in html, "Falta metadescripción"
          assert re.search(r'<main(?:\s|>)', html) and '<h1>' in html, "Falta ficha SEO visible"
          assert '<meta name="description"' in html, "Falta descripción del producto"
          blocks = re.findall(r'<script type="application/ld[+]json">(.*?)</script>', html, re.S)
          schemas = [json.loads(block) for block in blocks]
          assert any(s.get("@type") == "Product" and s.get("offers", {}).get("price") for s in schemas), "Falta Product/Offer JSON-LD"
          assert any(s.get("@type") == "BreadcrumbList" for s in schemas), "Falta BreadcrumbList JSON-LD"
          print("SEO verificado: descripción larga, metadescripción, Product/Offer y BreadcrumbList")
          PY
      - name: Verificar botón WhatsApp en fichas generadas
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("productos/100-gold-isolate-standard-5-lb-30188.html")
          html = page.read_text(encoding="utf-8")
          assert 'id="seo-wa-button"' in html, "Falta botón WhatsApp"
          assert 'id="seo-wa-panel"' in html, "Falta panel WhatsApp"
          assert 'id="seo-wa-send"' in html, "Falta botón de envío"
          assert 'supgo-wa-float' not in html, "Persiste botón flotante antiguo"
          print("WhatsApp integrado en HTML SEO")
          PY
      - name: Publicar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/ productos-assets/ sitemap-productos.xml
          if ! git diff --cached --quiet; then
            git commit -m "SEO: actualizar fichas individuales desde Supabase"
            git pull --rebase -X theirs origin main
            git push
          fi

# Regenerar fichas SEO sin encabezados agregados (2026-10-20).
