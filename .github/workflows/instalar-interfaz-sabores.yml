name: Instalar interfaz de sabores

on:
  push:
    paths:
      - 'catalogo/sabores-ui.js'
      - 'scripts/instalar_interfaz_sabores.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar interfaz en el catálogo
        run: python scripts/instalar_interfaz_sabores.py
      - name: Validar referencia
        run: grep -q 'sabores-ui.js?v=1' catalogo/index.html
      - name: Guardar cambio
        run: |
          git config user.name "lift-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/index.html
          if git diff --cached --quiet; then
            echo "La interfaz ya estaba instalada."
            exit 0
          fi
          git commit -m "Conectar interfaz de sabores al catálogo"
          git push
