name: Corregir duplicados header principal
on:
  push:
    paths:
      - '.github/workflows/corregir-duplicados-header.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Quitar parche duplicado y reubicar ofertas original
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          old=r'<!-- LIFT-HEADER-MOVIL-20261022 -->\s*<style>.*?</style>\s*<script>.*?</script>'
          html,n=re.subn(old,'',html,count=1,flags=re.S)
          print('Parche anterior retirado:',n)
          mark='<!-- LIFT-HEADER-ORIGINAL-OFERTAS-V2 -->'
          if mark not in html:
              injected=r"""
          <!-- LIFT-HEADER-ORIGINAL-OFERTAS-V2 -->
          <style>
          @media(max-width:767px){
            .lift-original-offers-in-header{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;margin:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;flex-shrink:0!important;z-index:auto!important;padding:9px 9px!important;font-size:12px!important;white-space:nowrap!important}
            .lift-original-offers-in-header *{font-size:inherit}
            .lift-hidden-duplicate-box{display:none!important}
          }
          </style>
          <script>
          (function(){
            function fix(){
              if(window.innerWidth>767)return;
              // Eliminar el enlace de ofertas que creó el parche previo, no el original.
              document.getElementById('lift-header-offers')?.remove();
              const items=[...document.querySelectorAll('a,button')];
              const pedido=items.find(x=>/mi pedido/i.test(x.textContent||'')&&!x.closest('#lift-wa-index'));
              if(!pedido)return;
              // Buscar el botón de ofertas original con contador visible.
              const ofertas=items.find(x=>x!==pedido&&/ofertas/i.test(x.textContent||'')&&/\d+/.test(x.textContent||'')&&x.id!=='lift-header-offers');
              if(ofertas){
                ofertas.style.removeProperty('display');
                ofertas.classList.add('lift-original-offers-in-header');
                // Conservar su enlace y sus eventos, trasladando el nodo real junto a Mi pedido.
                if(ofertas.previousElementSibling!==pedido)pedido.insertAdjacentElement('afterend',ofertas);
              }
              // La cajita es un acceso redundante a Mi pedido. Solo se oculta visualmente.
              const candidates=[...document.querySelectorAll('button,a,[role="button"]')];
              for(const el of candidates){
                if(el===pedido||el===ofertas||el.contains(pedido)||el.contains(ofertas))continue;
                const words=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).trim();
                const isBox=/📦/.test(words)||(/pedido|package|box/i.test(words)&&!(/mi pedido/i.test(el.textContent||'')));
                if(!isBox)continue;
                const rect=el.getBoundingClientRect();
                if(rect.width>=30&&rect.width<110&&rect.height>=30&&rect.height<110){
                  el.classList.add('lift-hidden-duplicate-box');
                  break;
                }
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix,{once:true});else fix();
            window.addEventListener('load',fix,{once:true});
          })();
          </script>
          """
              html=html.replace('</body>',injected+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          assert html.count('LIFT-HEADER-ORIGINAL-OFERTAS-V2')==1
          print('Actualizado index',p.stat().st_size)
          PY
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Header: conservar ofertas originales y ocultar cajita duplicada"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
