name: Quitar boton Instagram del index
on:
  push:
    paths:
      - '.github/workflows/quitar-boton-instagram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quitar-boton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Eliminar unicamente el boton Instagram
        shell: python
        run: |
          from pathlib import Path
          import re
          for filename in ("index.html","producto-vista.html"):
              s=Path(filename).read_text(encoding="utf-8")
              print("ARCHIVO",filename,"longitud",len(s))
              for pat in ("instagram","copiar enlace","copiar link","enlace"):
                  hits=list(re.finditer(pat,s,re.I))
                  print(pat,len(hits))
                  for m in hits[:18]:
                      print("CONTEXTO",repr(s[max(0,m.start()-280):m.end()+280]))
          raise SystemExit("Solo diagnostico, sin cambios")
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/quitar-boton-instagram.yml
          git add index.html
          git commit -m "Quitar botón copiar enlace para Instagram"
          git push
