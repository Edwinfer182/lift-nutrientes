name: Generar guías de compra
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generar_guias.py'
      - '.github/workflows/generar-guias.yml'
  workflow_dispatch:
  schedule:
    # Antes de fichas (9:25) y listados (9:40): así leen el registro de guías actualizado.
    - cron: '5 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-guias
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis
        run: python -m py_compile scripts/generar_guias.py
      - name: Generar guías con precios del catálogo
        run: python scripts/generar_guias.py
      - name: Publicar guías
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guias/
          if ! git diff --cached --quiet; then
            git commit -m "Guías: actualizar precios y comparativas desde Supabase"
            git pull --rebase origin main
            git push
          fi
