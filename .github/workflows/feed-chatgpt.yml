name: Feed ChatGPT Lift Nutrientes
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: feed-chatgpt
  cancel-in-progress: false
jobs:
  generar-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar catálogo desde Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/generar-feed-chatgpt.py
      - name: Validar las nueve columnas obligatorias
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('feeds/productos-chatgpt.csv').open(encoding='utf-8')))
          assert rows
          assert len(set(x['item_id'] for x in rows))==len(rows)
          assert all(all(x.values()) for x in rows)
          print('Productos válidos:',len(rows))
          PY
      - name: Guardar feed en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/productos-chatgpt.csv feeds/productos-chatgpt.jsonl feeds/estado-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "GEO: actualizar feed de productos desde Supabase"
            git push
          fi
