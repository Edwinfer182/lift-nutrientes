name: Revertir parches de botones y recuperar checkout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-herramientas-checkout.yml'
permissions:
  contents: write
concurrency:
  group: lift-checkout-admin-tools
  cancel-in-progress: false
jobs:
  revertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Eliminar exclusivamente inserciones recientes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert len(s)>10000 and '</body>' in s.lower()
          original=len(s)
          s=re.sub(r'<!-- LIFT-FIX-TOOLS-CHECKOUT-20261025 -->\s*<style>.*?</style>\s*<script>.*?</script>', '',s, flags=re.I|re.S)
          for marker in ('<!-- LIFT-GLOBAL-ADMIN-TOOLS-20261025 -->','<!-- LIFT-THREE-ADMIN-CHECKOUT-20261025 -->'):
              s=s.replace(marker,'')
          s=re.sub(r'<script\b[^>]*\bsrc\s*=\s*["\x27]/modulos/herramientas-flotantes\.js[^"\x27]*["\x27][^>]*>\s*</script>','',s,flags=re.I)
          assert '</body>' in s.lower() and len(s)>10000
          assert 'LIFT-THREE-ADMIN-CHECKOUT-20261025' not in s
          assert '/modulos/herramientas-flotantes.js' not in s
          p.write_text(s,encoding='utf-8')
          print('Rollback completo. Bytes antes:',original,'despues:',len(s))
          PY
      - name: Publicar rollback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "revert: eliminar inserciones flotantes y restaurar checkout"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No quedan inserciones que revertir"
          fi
