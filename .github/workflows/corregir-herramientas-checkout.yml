name: Organizar herramientas flotantes globales
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corregir-herramientas-checkout.yml'
      - 'modulos/herramientas-flotantes.js'
permissions:
  contents: write
concurrency:
  group: lift-correccion-herramientas-checkout
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Instalar menu unico global de herramientas administrativas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert Path('modulos/herramientas-flotantes.js').is_file()
          marker='<!-- LIFT-GLOBAL-ADMIN-TOOLS-20261025 -->'
          if marker not in s:
              script=marker+'\n<script src="/modulos/herramientas-flotantes.js" defer></script>\n'
              at=s.lower().rfind('</body>')
              assert at>=0, 'index.html no tiene cierre body'
              s=s[:at]+script+s[at:]
              p.write_text(s,encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          PY
      - name: Guardar en main y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: organizar herramientas flotantes en menu global"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Menu ya instalado"
          fi
