name: Probar sabores ahora

on:
  push:
    paths:
      - '.github/workflows/probar-sabores.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar_sabores.py
      - name: Guardar resultados
        run: |
          git config user.name "lift-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/sabores.json catalogo/cambios-sabores.json
          if git diff --cached --quiet; then
            echo "No hubo cambios."
            exit 0
          fi
          git commit -m "Primera sincronizacion de sabores"
          git push
