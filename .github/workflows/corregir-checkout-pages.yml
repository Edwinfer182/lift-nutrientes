name: Corregir checkout y publicar GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/corregir-checkout-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corregir-checkout-pages
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corregir ruta del pedido y texto literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('checkout/index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          import re
          # La redirección real usa una URL absoluta a la portada.
          s = s.replace("new URL('https://supgo.co/')", "new URL('https://supgo.co/mis-pedidos/')")
          s = s.replace('new URL("https://supgo.co/")', 'new URL("https://supgo.co/mis-pedidos/")')
          s = s.replace('/mi-pedido/', '/mis-pedidos/')
          # Texto literal barra+n fuera de scripts, detectado tras cierres de script.
          s, fixed = re.subn(r'(</script>\\s*)\\\\n(?=\\s*<(?:style|script|div|header|nav)\\b)', r'\\1', s, flags=re.I)
          print('Secuencias visibles eliminadas:', fixed)
          print('Redirección a mis-pedidos:', "new URL('https://supgo.co/mis-pedidos/')" in s)
          if s == original:
            print('Sin cambios nuevos: comprobar texto literal en HTML generado.')
          p.write_text(s, encoding='utf-8')
          print('Checkout actualizado; ruta /mis-pedidos/ y encabezado sin secuencia literal.')
          PY
      - name: Guardar corrección en main para GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Checkout: enviar a mis-pedidos y quitar n visible"
          git pull --rebase origin main
          git push origin HEAD:main
