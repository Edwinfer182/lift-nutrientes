name: Corregir checkout y publicar GitHub Pages
on:
  push:
    paths:
      - '.github/workflows/corregir-checkout-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corregir-checkout-pages
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corregir ruta del pedido y texto literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('checkout/index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          import re
          # Unificar la ruta del pedido en todo el checkout.
          s = s.replace('/mi-pedido/', '/mis-pedidos/')
          # Eliminar únicamente secuencias literales visibles al inicio del body
          # o inmediatamente antes de la barra de navegación.
          s, n1 = re.subn(r'(<body\\b[^>]*>\\s*)\\\\n', r'\\1', s, flags=re.I)
          s, n2 = re.subn(r'\\\\n(?=\\s*<(?:header|nav)\\b)', '', s, flags=re.I)
          # Algunos HTML imprimen la secuencia como texto al inicio del documento.
          s, n3 = re.subn(r'(?<=</head>)\\s*\\\\n', '', s, flags=re.I)
          print('Eliminadas:', n1, n2, n3)
          print('Rutas /mi-pedido/ restantes:', s.count('/mi-pedido/'))
          if s == original:
            print('Sin cambios nuevos: comprobar texto literal en HTML generado.')
          p.write_text(s, encoding='utf-8')
          print('Checkout actualizado; ruta /mis-pedidos/ y encabezado sin secuencia literal.')
          PY
      - name: Guardar corrección en main para GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Checkout: enviar a mis-pedidos y quitar n visible"
          git pull --rebase origin main
          git push origin HEAD:main
