name: Publicar index principal SUPGO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/integrar_whatsapp_index.py'
      - 'componentes/**'
      - 'paginas/**'
      - 'carrito/**'
      - 'favoritos/**'
      - 'ofertas/**'
      - '.github/workflows/publicar-index-principal.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-supgo
  cancel-in-progress: false

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Integrar WhatsApp general al index real
        run: python3 scripts/integrar_whatsapp_index.py
      - name: Guardar index actualizado de forma segura
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Index: integrar atención general WhatsApp"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Comprobar index principal antes de publicar
        shell: bash
        run: |
          test -s index.html || { echo "::error::index.html está vacío: publicación bloqueada para proteger la web."; exit 1; }
          grep -Eiq '<html|<!doctype html' index.html || { echo "::error::index.html no contiene HTML válido."; exit 1; }
          test -d componentes || echo "::warning::No existe la carpeta componentes."
          test -d paginas || echo "::warning::No existe la carpeta paginas."
          echo "Index principal validado."
      - name: Preparar sitio estático sin archivos internos
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' --exclude='/node_modules/' --exclude='/__pycache__/' ./ _site/
          test -s _site/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
