name: Diagnóstico WebKit iPhone
on:
  push:
    branches: [diag-webkit]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm init -y >/dev/null && npm i playwright && npx playwright install --with-deps webkit
      - name: Medir
        run: |
          mkdir -p out
          cat > t.js <<'JS'
          const { webkit, chromium, devices } = require('playwright');
          (async()=>{
            const b=await webkit.launch();
            for(const [name,opt] of [['movil',{...devices['iPhone 13']}],['pc',{viewport:{width:1366,height:900}}]]){
              const ctx=await b.newContext(opt);const p=await ctx.newPage();
              await p.goto('https://supgo.co/home/?t='+Date.now(),{waitUntil:'networkidle',timeout:60000}).catch(()=>{});
              await p.evaluate(()=>{const n=document.querySelector('#supgo-cookies .no');if(n)n.click()});
              for(let i=0;i<25;i++){await p.evaluate(()=>scrollBy(0,500));await p.waitForTimeout(200)}
              await p.evaluate(()=>scrollTo(0,0));await p.waitForTimeout(2500);await p.screenshot({path:'out/top-'+name+'.png'});const a=await p.evaluate(()=>getComputedStyle(document.querySelector('.brand-track')||document.body).transform);await p.waitForTimeout(1500);const b2=await p.evaluate(()=>getComputedStyle(document.querySelector('.brand-track')||document.body).transform);require('fs').writeFileSync('out/marquee-'+name+'.txt',a+' | '+b2);
              await p.screenshot({path:'out/home-'+name+'.png',fullPage:true});
              await ctx.close();
            }
            await b.close()})();
          JS
          node t.js
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas-webkit; git rm -rfq . ; cp -r out/* . ; rm -rf out node_modules package*.json t.js
          git add -A; git commit -qm "Medidas WebKit iPhone"; git push -f origin capturas-webkit
