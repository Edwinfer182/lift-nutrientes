name: Prueba fichas v2 (temporal)
on:
  push:
    branches: [fichas-v2]
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar con datos reales (misma configuración que la corrida diaria)
        env:
          SUPABASE_URL: https://vdxkknftyssjyfbdieqa.supabase.co
          SEO_OVERWRITE_EXISTING: '0'
        run: python scripts/generar_paginas_seo.py
      - name: Comparar SEO antes / después
        run: |
          python - <<'PY'
          import re, json, subprocess, pathlib
          files=[l for l in subprocess.run(["git","diff","--name-only","--","productos/"],capture_output=True,text=True).stdout.split() if l.endswith(".html")]
          def grab(h):
            g=lambda pat:(re.search(pat,h,re.S) or [None,None])[1]
            prod=None
            for b in re.findall(r'<script type="application/ld[+]json">(.*?)</script>',h,re.S):
              try:
                d=json.loads(b)
                if d.get("@type")=="Product":prod=d
              except Exception:pass
            offers=(prod or {}).get("offers") or {}
            if isinstance(offers,list):offers=offers[0] if offers else {}
            return {"title":g(r"<title>(.*?)</title>"),"desc":g(r'<meta name="description" content="([^"]*)"'),"canon":g(r'rel="canonical" href="([^"]*)"'),"robots":g(r'<meta name="robots" content="([^"]*)"'),
                    "price":offers.get("price"),"name":(prod or {}).get("name")}
          diffs={k:0 for k in ("title","desc","canon","robots","price","name")}; examples={k:[] for k in diffs}
          for f in files:
            old=subprocess.run(["git","show","HEAD:"+f],capture_output=True,text=True).stdout
            if not old:continue
            try:a,b=grab(old),grab(pathlib.Path(f).read_text(encoding="utf-8"))
            except Exception as e:
              print("ERROR",f,e);continue
            for k in diffs:
              if a[k]!=b[k]:
                diffs[k]+=1
                if len(examples[k])<8:examples[k].append((f,a[k],b[k]))
          all_pages=list(pathlib.Path("productos").glob("*.html"))
          v2=sum('data-ficha="v2' in p.read_text(encoding="utf-8",errors="replace") for p in all_pages)
          rep={"cambiadas":len(files),"total":len(all_pages),"con_v2":v2,"diferencias":diffs,"ejemplos":examples}
          print(json.dumps(rep,ensure_ascii=False,indent=1))
          pathlib.Path("informe").mkdir(exist_ok=True)
          pathlib.Path("informe/informe.json").write_text(json.dumps(rep,ensure_ascii=False,indent=1),encoding="utf-8")
          sin_v2=[p.name for p in all_pages if 'data-ficha="v2' not in p.read_text(encoding="utf-8",errors="replace")]
          pathlib.Path("informe/sin_v2.txt").write_text("\n".join(sorted(sin_v2)),encoding="utf-8")
          PY
      - name: Externalizar CSS
        if: always() como en la corrida de listados
        run: python scripts/seo_indexacion.py || true
      - name: Muestras
        if: always()
        run: |
          mkdir -p informe/productos
          for f in 100-gold-isolate-standard-5-lb-30188.html lipodrene-amarillo-90-12268.html super-mass-gainer-6-lb-chocolate-30144.html; do cp "productos/$f" informe/productos/ || true; done
          ls productos/*-121.html productos/*-901274.html productos/*-398.html 2>/dev/null | head -3 | xargs -I{} cp {} informe/productos/
          git status --short productos-assets | head -20 > informe/assets.txt
          git ls-files --others --exclude-standard productos-assets | xargs -I{} cp {} informe/productos/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-fichas-v2
          path: informe/
