name: Verificar sitemaps dinámicos SUPGO (sin generar archivos)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar XML publicado por Vercel
        shell: bash
        run: |
          set -euo pipefail
          for tipo in sitemap sitemap-productos sitemap-categorias sitemap-laboratorios sitemap-paginas sitemap-guias; do
            echo "Comprobando ${tipo}.xml"
            curl --fail --silent --show-error --max-time 25 "https://supgo.co/${tipo}.xml" -o "/tmp/${tipo}.xml"
          done
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ["sitemap","sitemap-productos","sitemap-categorias","sitemap-laboratorios","sitemap-paginas","sitemap-guias"]:
              root=ET.parse(Path("/tmp")/(name+".xml")).getroot()
              if root.tag not in ("{http://www.sitemaps.org/schemas/sitemap/0.9}urlset","{http://www.sitemaps.org/schemas/sitemap/0.9}sitemapindex"):
                  raise SystemExit("XML no válido: "+name)
              if len(root)==0: raise SystemExit("Sitemap vacío: "+name)
              print(name, "URLs:",len(root))
          PY
