name: Generar páginas SEO de categorías y laboratorios
on:
  push:
    paths:
      - 'scripts/generar_listados_seo.py'
      - '.github/workflows/generar-listados-seo.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * *'
permissions:
  contents: write
concurrency:
  group: seo-listados
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis
        run: python -m py_compile scripts/generar_listados_seo.py
      - name: Generar páginas
        run: python scripts/generar_listados_seo.py
      - name: Publicar páginas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add categorias/ laboratorios/
          if ! git diff --cached --quiet; then
            git commit -m "SEO: generar páginas de categorías y laboratorios"
            git pull --rebase origin main
            git push
          fi
