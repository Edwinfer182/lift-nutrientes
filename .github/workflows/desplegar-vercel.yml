name: Publicar SUPGO en Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supgo-deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuración
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto VERCEL_DEPLOY_HOOK en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Solicitar despliegue de main
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 40 -X POST "$DEPLOY_HOOK")
          echo "$response" | python3 -c 'import sys,json; x=json.load(sys.stdin); assert x.get("state") in ("PENDING","QUEUED","BUILDING","READY"), f"Respuesta inesperada: {x}"; print("Vercel aceptó el despliegue:",x.get("state"))'
