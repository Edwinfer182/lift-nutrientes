name: Identidad GEO Lift Nutrientes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/insertar-identidad-geo.py'
      - '.github/workflows/identidad-geo.yml'
permissions:
  contents: write
concurrency:
  group: identidad-geo
  cancel-in-progress: false
jobs:
  identidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actualizar identidad estructurada
        run: python scripts/insertar-identidad-geo.py
      - name: Comprobar JSON-LD de identidad
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          class JsonScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  self.capture = tag == "script" and dict(attrs).get("type") == "application/ld+json"
              def handle_data(self, data):
                  if self.capture:
                      self.scripts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.capture = False
          p = Path("productos/iso-100-5-lb-dunkin-mocha-latte-901284.html")
          html = p.read_text(encoding="utf-8")
          parser = JsonScripts()
          parser.feed(html)
          entries = [json.loads(s) for s in parser.scripts]
          ids = [x.get("@id") for x in entries if isinstance(x,dict)]
          print(f"JSON-LD encontrados: {len(entries)}; identidades: {ids}")
          assert "https://supgo.co/#organization" in ids, "No se insertó identidad en ficha ISO100"
          print("Identidad GEO validada en ficha ISO100")
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "GEO: publicar identidad de Lift Nutrientes en paginas HTML"
            git push
          fi
