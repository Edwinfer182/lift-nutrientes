name: Ocultar WhatsApp durante offcanvas
on:
  push:
    paths:
      - '.github/workflows/ocultar-wa-offcanvas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Incorporar visibilidad contextual WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          marker='<!-- LIFT-WA-OFFCANVAS-V1 -->'
          if marker in h:
              print('Ya existe');raise SystemExit(0)
          fragment=r"""
          <!-- LIFT-WA-OFFCANVAS-V1 -->
          <style>
          body.lift-offcanvas-active #lift-wa-index,
          body.lift-offcanvas-active #seo-wa-float,
          body.lift-offcanvas-active .lift-wa-floating,
          body.lift-offcanvas-active a[href*="wa.me"][style*="fixed"],
          body.lift-offcanvas-active a[href*="whatsapp"][style*="fixed"]{display:none!important;pointer-events:none!important}
          </style>
          <script>
          (function(){
            const overlays=['[role="dialog"]','.offcanvas','.off-canvas','.drawer','.product-modal','.cart-drawer','.favorites-drawer','.modal','.sheet'];
            function shown(el){
              if(!el||el.closest('#lift-wa-index'))return false;
              const s=getComputedStyle(el),r=el.getBoundingClientRect();
              if(s.display==='none'||s.visibility==='hidden'||s.opacity==='0'||el.hidden||el.getAttribute('aria-hidden')==='true')return false;
              return r.width>Math.min(220,innerWidth*.45)&&r.height>Math.min(220,innerHeight*.28);
            }
            function sync(){
              const open=overlays.some(sel=>[...document.querySelectorAll(sel)].some(el=>shown(el)));
              document.body.classList.toggle('lift-offcanvas-active',open);
              // También ocultar los accesos flotantes antiguos sin alterar los de producto.
              [...document.querySelectorAll('a,button')].forEach(el=>{
                if(el.closest('#lift-wa-index')||el.closest('#seo-wa-float'))return;
                const label=((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.className||'')).toLowerCase();
                const href=(el.getAttribute('href')||'').toLowerCase();
                if(!/whatsapp|wa.me|wa-float|floating-wa/.test(label+' '+href))return;
                const c=getComputedStyle(el),p=el.parentElement?getComputedStyle(el.parentElement):null;
                if(c.position!=='fixed'&&p?.position!=='fixed')return;
                if(open){
                  if(!el.hasAttribute('data-lift-wa-display'))el.setAttribute('data-lift-wa-display',el.style.display||'');
                  el.style.setProperty('display','none','important');
                }else if(el.hasAttribute('data-lift-wa-display')){
                  const old=el.getAttribute('data-lift-wa-display');
                  el.style.removeProperty('display');
                  if(old)el.style.display=old;
                  el.removeAttribute('data-lift-wa-display');
                }
              });
            }
            let queued=false;
            function schedule(){
              if(queued)return;queued=true;
              requestAnimationFrame(()=>{queued=false;sync()});
            }
            const observer=new MutationObserver(schedule);
            observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','hidden','aria-hidden','open']});
            document.addEventListener('click',()=>setTimeout(sync,0),true);
            document.addEventListener('keydown',schedule,true);
            window.addEventListener('pageshow',schedule);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync,{once:true});else sync();
          })();
          </script>
          """
          assert '</body>' in h
          p.write_text(h.replace('</body>',fragment+'\n</body>',1),encoding='utf-8')
          print('Control de WhatsApp añadido')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Ocultar WhatsApp flotante en paneles de compra"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
