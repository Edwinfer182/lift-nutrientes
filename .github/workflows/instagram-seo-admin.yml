name: Instalar Instagram SEO en panel administrativo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/instagram-seo-admin.yml'
permissions:
  contents: write
concurrency:
  group: lift-instagram-seo-admin
  cancel-in-progress: false
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validar archivos
        run: |
          test -s index.html
          test -s modulos/instagram-seo.js
      - name: Instalar botón en cuadrícula real del checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          marker='<!-- LIFT-INSTAGRAM-SEO-ADMIN-V2 -->'
          # Quitar instalación V1 anterior, si existe, sin afectar el resto.
          old='<!-- LIFT-INSTAGRAM-SEO-ADMIN-V1 -->'
          if old in html:
              start=html.index(old)
              end=html.find('</script>',html.find('</script>',start)+len('</script>'))
              if end<0: raise SystemExit('Bloque V1 incompleto; no se modifica')
              html=html[:start]+html[end+len('</script>'):]
          if marker not in html:
              if '</body>' not in html.lower(): raise SystemExit('No existe cierre body')
              snippet="""<!-- LIFT-INSTAGRAM-SEO-ADMIN-V2 -->
          <script src="/modulos/instagram-seo.js" defer></script>
          <script>
          (function(){
            function install(){
              if(!document.body.classList.contains('liftAdminUnlocked'))return;
              const row=document.querySelector('#checkoutModal .liftAdminToolsRow') || document.querySelector('.liftAdminToolsRow');
              if(!row)return;
              // Mantener el boton del checkout y eliminar solamente copias flotantes adicionales.
              const candidates=[...document.querySelectorAll('button,a')].filter(x=>
                x.id==='lift-ig-seo-launcher' || (x.textContent||'').trim()==='Instagram SEO');
              for(const x of candidates){
                if(row.contains(x))continue;
                const pos=getComputedStyle(x).position;
                const parentPos=x.parentElement?getComputedStyle(x.parentElement).position:'';
                if(pos==='fixed'||parentPos==='fixed')x.remove();
              }
              if(row.querySelector('#lift-ig-seo-launcher'))return;
              const btn=document.createElement('button');
              btn.type='button';btn.id='lift-ig-seo-launcher';btn.textContent='Instagram SEO';
              btn.onclick=function(){
                if(!window.LiftInstagramSEO){alert('No se cargó Instagram SEO');return}
                if(window.LiftInstagramSEO.openSelector)window.LiftInstagramSEO.openSelector();
                else alert('Falta actualizar el selector de Instagram SEO');
              };
              row.appendChild(btn);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
            new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
          })();
          </script>
          """
              idx=html.lower().rfind('</body>')
              html=html[:idx]+snippet+'\n'+html[idx:]
          p.write_text(html,encoding='utf-8')
          PY
      - name: Validar instalación
        run: |
          grep -q 'LIFT-INSTAGRAM-SEO-ADMIN-V2' index.html
          grep -q 'liftAdminToolsRow' index.html
          grep -q 'openSelector' modulos/instagram-seo.js
      - name: Publicar cambios al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: acceso Instagram SEO en panel administrativo"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Sin cambios pendientes"
          fi
