name: Publicar paginas nuevas SUPGO
on:
  workflow_dispatch:
  push:
    paths:
      - 'plantillas/supgo-pages.css'
      - 'plantillas/supgo-pages.js'
      - '.github/workflows/publicar-paginas-nuevas.yml'
permissions:
  contents: write
concurrency:
  group: publicar-paginas-nuevas
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar componentes y actualizar cache de todas las rutas nuevas
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, shutil
          base=Path('paginas')
          base.mkdir(exist_ok=True)
          for filename in ('supgo-pages.css','supgo-pages.js'):
              shutil.copyfile(Path('plantillas')/filename,base/filename)
          version='cards-'+os.environ['RUN_ID']
          count=0
          for folder in ('categorias','laboratorios','buscar','ofertas','favoritos'):
              for path in Path(folder).rglob('*.html'):
                  html=path.read_text(encoding='utf-8')
                  updated=re.sub(r'(/paginas/supgo-pages\.(?:css|js))(?:\?v=[^"\x27<>]*)?',lambda m:m.group(1)+'?v='+version,html)
                  if updated!=html:
                      path.write_text(updated,encoding='utf-8')
                      count+=1
          print('Rutas actualizadas:',count)
          assert count>0, 'No se encontraron paginas para actualizar'
          PY
      - name: Validar tarjetas nuevas antes de publicar
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('paginas/supgo-pages.css').read_text(encoding='utf-8')
          js=Path('paginas/supgo-pages.js').read_text(encoding='utf-8')
          assert '.product-photo' in css and '.product-details' in css, 'Faltan estilos de tarjetas nuevas'
          assert "photo.className='product-photo'" in js, 'No se esta usando el componente nuevo'
          assert "buy.className='buy'" in js, 'Falta el icono de carrito compacto'
          assert 'background:#fff!important' in css, 'El fondo de imagen debe ser blanco'
          assert '.secondary-photo' in css and "alternate.className='secondary-photo'" in js, 'Falta segunda imagen hover'
          assert "el.addEventListener('pointerenter'" in js, 'Falta activacion de hover en toda la tarjeta'
          assert 'padding:100% 0 0!important' in css, 'Falta el espacio uniforme de imagen'
          print('Fondo blanco, altura uniforme, hover y segunda imagen validados')
          PY
      - name: Comprobar sintaxis JavaScript
        run: node --check paginas/supgo-pages.js
      - name: Guardar paginas generadas en main para publicacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paginas/supgo-pages.css paginas/supgo-pages.js categorias/ laboratorios/ buscar/ ofertas/ favoritos/
          if ! git diff --cached --quiet; then
            git commit -m "Actions: publicar tarjetas nuevas SUPGO"
            git pull --rebase origin main
            git push origin main
          fi
