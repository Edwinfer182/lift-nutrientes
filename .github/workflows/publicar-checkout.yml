name: Publicar checkout independiente SUPGO

on:
  push:
    branches: [main]
    paths:
      - 'checkout/**'
      - 'componentes/**'
      - 'carrito/**'
      - 'mis-pedidos/**'
      - '.github/workflows/publicar-checkout.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: supgo-legacy-validation
  cancel-in-progress: true

jobs:
  publicar-checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar version actual de main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar checkout independiente
        shell: bash
        run: |
          test -s checkout/index.html || { echo "::error::No existe checkout/index.html"; exit 1; }
          grep -Eiq '<html|<!doctype html' checkout/index.html || { echo "::error::Checkout no contiene HTML valido"; exit 1; }
          test -s index.html || { echo "::error::Falta el index principal"; exit 1; }
          echo "Checkout independiente y pagina principal presentes."
      - name: Preparar sitio completo para Pages
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' --exclude='/node_modules/' --exclude='/__pycache__/' ./ _site/
          test -s _site/checkout/index.html
          test -s _site/index.html
      - name: Verificar offcanvas de Mi pedido en artefacto
        shell: bash
        run: |
          grep -Fq "supgo:pedido-generado" _site/checkout/index.html || { echo "::error::Checkout no abre seguimiento local"; exit 1; }
          grep -Fq 'header-loader.js?v=20261022-offcanvas-only5' _site/checkout/index.html || { echo "::error::Checkout no importa offcanvas"; exit 1; }
          grep -Fq "Mi pedido" _site/componentes/header.html || { echo "::error::Falta Mi pedido en header compartido"; exit 1; }
          grep -Fq "header-loader.js" _site/carrito/index.html || { echo "::error::Carrito no carga header compartido"; exit 1; }
          echo "OK: modal nuevo y checkout incluidos en artefacto de Pages."
      - name: Validar cargador y boton Mi pedido antes del deploy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('_site/componentes/header.html').read_text()
          l=Path('_site/componentes/header-loader.js').read_text()
          c=Path('_site/carrito/index.html').read_text()
          assert 'class="iconbtn myOrder"' in h, 'No existe boton Mi pedido en header'
          assert 'supgoOpenPedidoCompartido' in l, 'No existe offcanvas compartido'
          assert 'data-supgo-order-access' in c, 'Falta boton Mi pedido en carrito'
          print('VALIDADO: boton, offcanvas y cargador del carrito')
          PY

