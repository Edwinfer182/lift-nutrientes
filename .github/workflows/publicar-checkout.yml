name: Publicar checkout independiente SUPGO

on:
  push:
    branches: [main]
    paths:
      - 'checkout/**'
      - 'componentes/**'
      - 'carrito/**'
      - 'mis-pedidos/**'
      - '.github/workflows/publicar-checkout.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: supgo-legacy-validation
  cancel-in-progress: true

jobs:
  publicar-checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar version actual de main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar checkout independiente
        shell: bash
        run: |
          test -s checkout/index.html || { echo "::error::No existe checkout/index.html"; exit 1; }
          grep -Eiq '<html|<!doctype html' checkout/index.html || { echo "::error::Checkout no contiene HTML valido"; exit 1; }
          test -s index.html || { echo "::error::Falta el index principal"; exit 1; }
          echo "Checkout independiente y pagina principal presentes."
      - name: Preparar sitio completo para Pages
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/_site/' --exclude='/node_modules/' --exclude='/__pycache__/' ./ _site/
          test -s _site/checkout/index.html
          test -s _site/index.html
      - name: Verificar redireccion a seguimiento nativo
        shell: bash
        run: |
          grep -Fq 'https://supgo.co/?mi-pedido=1' _site/checkout/index.html || { echo "::error::Checkout no redirige al index tras generar pedido"; exit 1; }
          grep -Fq 'supgoOpenPedidoCompartido' _site/componentes/header.js || { echo "::error::Falta enlace a consulta principal"; exit 1; }
          grep -Fq 'mi-pedido' _site/index.html || { echo "::error::Index no reconoce la ruta de consulta"; exit 1; }
          echo "OK: checkout e index comparten ruta nativa de Mi pedido."
      - name: Validar enlaces del header y carrito
        shell: bash
        run: |
          test -s _site/componentes/header-loader.js
          grep -Fq 'myOrder' _site/componentes/header.html
          grep -Fq 'header-loader.js' _site/carrito/index.html
          echo "OK: enlaces de Mi pedido disponibles."
