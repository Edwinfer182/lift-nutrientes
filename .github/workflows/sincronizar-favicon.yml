name: Sincronizar favicon en paginas existentes
on:
  push:
    paths:
      - '.github/workflows/sincronizar-favicon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar script
        run: python -m py_compile scripts/sincronizar_favicon.py
      - name: Replicar favicon real del index
        run: python scripts/sincronizar_favicon.py
      - name: Comprobar resultado y guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos/ categorias/ laboratorios/ ofertas/ checkout/ mi-pedido/ mis-pedidos/ favoritos/ buscar/ carrito/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Usar favicon del index en paginas publicas"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
