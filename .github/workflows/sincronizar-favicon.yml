name: Sincronizar favicon en paginas existentes
on:
  push:
    paths:
      - '.github/workflows/sincronizar-favicon.yml'
      - 'scripts/sincronizar_favicon.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar script
        run: python -m py_compile scripts/sincronizar_favicon.py
      - name: Replicar favicon real del index
        run: python scripts/sincronizar_favicon.py
      - name: Comprobar resultado y guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Incluir todas las páginas generadas y cambios rastreados antes de rebase.
          git add -A
          git status --short | tail -n 15
          if ! git diff --cached --quiet; then
            git commit -m "Usar favicon del index en paginas publicas"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
