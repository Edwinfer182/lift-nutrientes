name: Merchant Center - generar feed
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
  push:
    paths:
      - 'scripts/generar_merchant_feed.py'
      - 'merchant-approved-ids.json'
      - '.github/workflows/merchant-feed.yml'
permissions:
  contents: write
concurrency:
  group: merchant-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar feed desde Supabase
        run: python scripts/generar_merchant_feed.py
      - name: Verificar XML
        run: python -c "import xml.etree.ElementTree as E; E.parse('merchant-feed.xml')"
      - name: Publicar feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchant-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Merchant: actualizar feed de productos revisados"
            git pull --rebase origin main
            git push
          fi
