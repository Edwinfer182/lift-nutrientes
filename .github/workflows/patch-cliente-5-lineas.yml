name: Patch cliente 5 lineas

on:
  push:
    paths:
      - '.github/workflows/patch-cliente-5-lineas.yml'
      - 'scripts/patch_cliente_5_lineas.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche
        run: python scripts/patch_cliente_5_lineas.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Leer hasta 5 líneas en datos del cliente"
          git push
